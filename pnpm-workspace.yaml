# recast@0.23.11 loads `@babel/parser` via a bare (phantom) require, so pnpm
# hands it the hoisted @babel/parser@8.0.0. recast's parser plugin list is
# Babel-7-era (importAssertions, decimal, recordAndTuple syntaxType, the
# "minimal" pipeline proposal, …), all of which Babel 8 rejects — which surfaced
# as `"pipelineOperator" requires "proposal"` (and then more) while @remotion/
# studio-server parses files for its editable-sequence-props codemod. Give recast
# its own Babel 7 parser so the whole 7-era list is accepted at once.
packageExtensions:
  recast@0.23.11:
    dependencies:
      "@babel/parser": "^7.24.1"

patchedDependencies:
  '@cloudflare/containers@0.3.7': patches/@cloudflare__containers@0.3.7.patch
  gray-matter@4.0.3: patches/gray-matter@4.0.3.patch
  recast@0.23.11: patches/recast@0.23.11.patch
