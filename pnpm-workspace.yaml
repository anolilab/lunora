packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tests/*"
  - "!*/__test__/**"
  - "!*/__tests__/**"

autoInstallPeers: true

catalogs:
  build:
    "@babel/core": ^7.29.7
    "@babel/preset-react": ^7.29.7
    "@visulima/packem": 2.0.0-alpha.78
    "babel-plugin-react-compiler": ^19.1.0-rc.2
    esbuild: ^0.28.0
  dev:
    "@anolilab/semantic-release-pnpm": ^8.1.15
    "@anolilab/semantic-release-preset": ^13.4.16
    "@total-typescript/ts-reset": ^0.6.1
    "@tsconfig/node24": ^24.0.4
    cross-env: ^10.1.0
    tsx: ^4.22.4
  lint:
    "@anolilab/eslint-config": 27.0.2
    "@anolilab/prettier-config": 10.0.1
    "@eslint-react/eslint-plugin": 5.8.8
    "@ospm/eslint-plugin-react-unhookify": ^1.0.2
    eslint: 10.4.1
    eslint-plugin-jsx-a11y: ^6.10.2
    eslint-plugin-react: ^7.37.5
    eslint-plugin-react-compiler: ^19.1.0-rc.2
    eslint-plugin-react-hooks: 7.1.1
    eslint-plugin-react-perf: ^3.3.3
    eslint-plugin-react-refresh: 0.5.2
    "@tanstack/eslint-plugin-query": 5.100.9
    eslint-plugin-react-you-might-not-need-an-effect: 1.0.0
    eslint-plugin-testing-library: 7.16.2
    eslint-plugin-validate-jsx-nesting: ^0.1.1
    husky: ^9.1.7
    prettier: 3.8.3
  node:
    fast-glob: ^3.3.3
    rimraf: 6.1.3
  prod:
    "@anolilab/commitlint-config": 10.0.1
    "@anolilab/multi-semantic-release": ^4.4.4
    "@anolilab/textlint-config": 13.0.1
    "@commitlint/cli": ^21.0.2
    "@commitlint/config-conventional": ^21.0.2
    cz-conventional-changelog: ^3.3.0
    "@visulima/vis": 1.0.0-alpha.25
    "@visulima/tabular": 4.0.0-alpha.11
  test:
    "@vitest/coverage-v8": 4.1.7
    "@vitest/ui": 4.1.7
    fake-indexeddb: 6.2.5
    vitest: 4.1.7
  tsc:
    typescript: 6.0.3
  types:
    "@types/node": 25.9.1
  cloudflare:
    "@cloudflare/vitest-pool-workers": ^0.16.11
    "@cloudflare/workers-types": ^4.20260602.1
    miniflare: ^4.20260529.0
    wrangler: ^4.96.0
  e2e:
    "@playwright/test": ^1.60.0
    playwright: ^1.60.0
  tooling:
    ts-morph: ^28.0.0
  vite:
    "@cloudflare/vite-plugin": ^1.39.1
    "@visulima/vite-overlay": ^1.3.7
    jsonc-parser: ^3.3.1
    vite: ^8.0.16
  frontend:
    "@tanstack/react-query": ^5.100.14
    "@tanstack/react-table": ^8.21.3
    "@tanstack/react-virtual": ^3.14.1
    "@testing-library/dom": ^10.4.1
    "@testing-library/react": ^16.3.2
    "@types/react": ^19.2.16
    "@types/react-dom": ^19.2.3
    jsdom: ^29.1.1
    react: ^19.2.7
    react-dom: ^19.2.7
  mail:
    "@visulima/email": 1.0.0-alpha.32
    "@react-email/render": 2.0.8
  docs:
    "fumadocs-core": ^16.9.3
    "fumadocs-ui": ^16.9.3
    "fumadocs-mdx": ^15.0.10
    "next": ^16.2.7
    "tailwindcss": ^4.3.0
  auth:
    "better-auth": ^1.6.13
  drizzle:
    drizzle-orm: ^0.45.2
  http:
    hono: ^4.12.23

preferWorkspacePackages: true

saveExact: true

saveWorkspaceProtocol: true

sharedWorkspaceLockfile: true

strictPeerDependencies: false

# pnpm v11 refuses to install when transitive deps want to run post-install
# scripts unless the workspace explicitly approves them. Re-run
# `pnpm approve-builds` to repopulate this list when a new package joins.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  rs-module-lexer: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.13'
  - '@better-auth/drizzle-adapter@1.6.13'
  - '@better-auth/kysely-adapter@1.6.13'
  - '@better-auth/memory-adapter@1.6.13'
  - '@better-auth/mongo-adapter@1.6.13'
  - '@better-auth/prisma-adapter@1.6.13'
  - '@better-auth/telemetry@1.6.13'
  - '@cloudflare/workers-types@4.20260602.1'
  - '@eslint-react/ast@5.8.8'
  - '@eslint-react/core@5.8.8'
  - '@eslint-react/eslint-plugin@5.8.8'
  - '@eslint-react/eslint@5.8.8'
  - '@eslint-react/jsx@5.8.8'
  - '@eslint-react/shared@5.8.8'
  - '@eslint-react/var@5.8.8'
  - better-auth@1.6.13
  - eslint-plugin-react-dom@5.8.8
  - eslint-plugin-react-jsx@5.8.8
  - eslint-plugin-react-naming-convention@5.8.8
  - eslint-plugin-react-rsc@5.8.8
  - eslint-plugin-react-web-api@5.8.8
  - eslint-plugin-react-x@5.8.8
  - eslint-plugin-react-you-might-not-need-an-effect@1.0.0
  - tsx@4.22.4
  - '@cloudflare/vite-plugin@1.39.1'
  - '@cloudflare/vitest-pool-workers@0.16.11'
  - '@cloudflare/workers-types@4.20260602.1'
  - '@next/env@16.2.7'
  - '@next/swc-darwin-arm64@16.2.7'
  - '@next/swc-darwin-x64@16.2.7'
  - '@next/swc-linux-arm64-gnu@16.2.7'
  - '@next/swc-linux-arm64-musl@16.2.7'
  - '@next/swc-linux-x64-gnu@16.2.7'
  - '@next/swc-linux-x64-musl@16.2.7'
  - '@next/swc-win32-arm64-msvc@16.2.7'
  - '@next/swc-win32-x64-msvc@16.2.7'
  - '@tanstack/react-virtual@3.14.1'
  - '@tanstack/virtual-core@3.16.1'
  - '@types/react@19.2.16'
  - miniflare@4.20260529.0
  - next@16.2.7
  - react-dom@19.2.7
  - react@19.2.7
  - vite@8.0.16
  - wrangler@4.96.0
