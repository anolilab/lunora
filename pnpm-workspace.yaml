packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tests/*"
  - "!*/__test__/**"
  - "!*/__tests__/**"

autoInstallPeers: true

catalogs:
  build:
    "@babel/core": ^7.29.0
    "@visulima/packem": 2.0.0-alpha.78
    esbuild: ^0.28.0
  dev:
    "@anolilab/semantic-release-pnpm": ^8.1.9
    "@anolilab/semantic-release-preset": ^13.4.10
    "@total-typescript/ts-reset": ^0.6.1
    "@tsconfig/node22": ^22.0.5
    audit-ci: 7.1.0
    cross-env: ^10.1.0
    tsx: ^4.20.3
  lint:
    "@anolilab/eslint-config": 27.0.2
    "@anolilab/prettier-config": 10.0.1
    eslint: 10.4.0
    husky: ^9.1.7
    prettier: 3.8.3
  node:
    fast-glob: ^3.3.3
    rimraf: 6.1.3
  prod:
    "@anolilab/commitlint-config": 10.0.1
    "@anolilab/multi-semantic-release": ^4.4.1
    "@anolilab/textlint-config": 13.0.1
    "@commitlint/cli": ^21.0.1
    "@commitlint/config-conventional": ^21.0.1
    cz-conventional-changelog: ^3.3.0
    "@visulima/vis": 1.0.0-alpha.24
    "@visulima/tabular": 4.0.0-alpha.11
  test:
    "@vitest/coverage-v8": 4.1.6
    "@vitest/ui": 4.1.6
    vitest: 4.1.7
  tsc:
    typescript: 6.0.3
  types:
    "@types/node": 25.9.1
  cloudflare:
    "@cloudflare/vitest-pool-workers": ^0.16.10
    "@cloudflare/workers-types": ^4.20260526.1
    miniflare: ^4.20260526.0
    wrangler: ^4.95.0
  e2e:
    "@playwright/test": ^1.49.0
    playwright: ^1.49.0
  tooling:
    ts-morph: ^28.0.0
  vite:
    "@cloudflare/vite-plugin": ^1.39.0
    "@visulima/vite-overlay": ^1.3.7
    jsonc-parser: ^3.3.1
    vite: ^8.0.14
  frontend:
    "@testing-library/dom": ^10.4.1
    "@testing-library/react": ^16.3.0
    "@types/react": ^19.2.2
    "@types/react-dom": ^19.2.1
    jsdom: ^29.1.1
    react: ^19.2.0
    react-dom: ^19.2.0
  mail:
    "@visulima/email": 1.0.0-alpha.32
    "@react-email/render": 2.0.8
  docs:
    "fumadocs-core": ^16.9.1
    "fumadocs-ui": ^16.9.1
    "fumadocs-mdx": ^15.0.9
    "next": ^16.2.6
    "tailwindcss": ^4.3.0

preferWorkspacePackages: true

saveExact: true

saveWorkspaceProtocol: true

sharedWorkspaceLockfile: true

strictPeerDependencies: false
