saveExact: true

saveWorkspaceProtocol: true

sharedWorkspaceLockfile: true

strictPeerDependencies: false

# Acknowledged peer-dependency drift. This monorepo deliberately runs its
# tooling AHEAD of what most plugins declare in their peer ranges (eslint 10,
# TypeScript 6, vite 8, prettier 3.8.x, babel 8, rollup 4.6x, …). Every entry
# below is a peer whose installed version is intentional and verified-working;
# `allowedVersions` tells pnpm to stop warning rather than us downgrading the
# tooling to satisfy a stale plugin range. The remaining handful (marked,
# rollup, @csstools/postcss-slow-plugins, @bomb.sh/tab, @visulima/pail) are
# deep @visulima prerelease transitives where forcing a bump would risk the
# `minimumReleaseAge` gate or skew the vis toolchain — they're warnings only
# (strictPeerDependencies is false). Bump the matching range when the real
# installed version moves; prereleases are pinned exact on purpose.
peerDependencyRules:
  allowedVersions:
    # @anolilab/commitlint-config peers an older @commitlint/cli range
    "@commitlint/cli": ">=21"
    # @anolilab/eslint-config (+ @anolilab/prettier-config) pin exact plugin
    # versions; we track a newer minor/patch of each.
    "@eslint-react/eslint-plugin": ">=5.7.10"
    "@tanstack/eslint-plugin-query": ">=5.100.14"
    "@tanstack/eslint-plugin-router": ">=1.161.6"
    "eslint-plugin-react-refresh": ">=0.5.2"
    "eslint-plugin-react-you-might-not-need-an-effect": ">=0.10.0"
    "@eslint/css": ">=1.2.0"
    "eslint-plugin-zod": ">=3.12.0"
    "tailwind-csstree": ">=0.3.2"
    "prettier": ">=3.8.3"
    # typescript-eslint sub-package skew (plugin wants a newer parser patch).
    "@typescript-eslint/parser": ">=8.59.1"
    # Core tooling run ahead of every plugin's declared peer range.
    "eslint": ">=9.11.0"
    "typescript": ">=5.6.2"
    "vite": ">=4.2.0"
    "@babel/core": ">=7"
    "tailwindcss": ">=3"
    "babel-plugin-react-compiler": ">=1.0.0"
    # @visulima prerelease transitives (packem / cerebro / tui internals).
    "marked": ">=15"
    "rollup": ">=4.60.1"
    "@csstools/postcss-slow-plugins": ">=2"
    "@bomb.sh/tab": ">=0.0.15"
    "@visulima/pail": "4.0.0-alpha.22"

# pnpm v11 refuses to install when transitive deps want to run post-install
# scripts unless the workspace explicitly approves them. Re-run
# `pnpm approve-builds` to repopulate this list when a new package joins.
allowBuilds:
  # Its only build hook is a postinstall that console.logs a TOS notice — no
  # build step (the tarball ships dist/), so skip it.
  '@coinbase/x402': false
  '@parcel/watcher': true
  better-sqlite3: true
  core-js: false
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  msw: false
  protobufjs: true
  rs-module-lexer: true
  sharp: true
  ssh2: true
  unrs-resolver: true
  vue-demi: false
  workerd: true

# Only versions that are currently within the `minimumReleaseAge` window need to
# live here; once a version ages past the cutoff its entry becomes dead weight.
#
# IMPORTANT: keep ONE entry per package name. pnpm's version-policy matcher stops
# at the first rule whose name matches and only honours THAT rule's versions, so a
# second line for the same package is silently ignored (it shadows, it does not
# merge). To allow several versions of one package, use a union on a single line:
#   - 'better-auth@1.6.13 || 1.6.14'
# When bumping a dependency, UPDATE its existing line — do not append a new one.
