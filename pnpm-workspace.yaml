packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tests/*"
  - "!*/__test__/**"
  - "!*/__tests__/**"

autoInstallPeers: true

minimumReleaseAge: 1440

blockExoticSubdeps: true

# `@coinbase/x402` (optional CDP-wallet peer of @lunora/x402) ships a
# `postinstall` that only prints a CDP-TOS notice (a pure `console.log`, no
# native build). pnpm 11 blocks un-approved build scripts and exits non-zero on
# every script run (ERR_PNPM_IGNORED_BUILDS reads as "deps dirty"), so approve
# this one explicitly — the same entry `pnpm approve-builds` would write. It is
# currently the only dependency in the tree with an un-prebuilt build script.
onlyBuiltDependencies:
  - "@coinbase/x402"

overrides:
  # ---------------------------------------------------------------------------
  # Singleton pins — one copy of these across the whole graph
  # ---------------------------------------------------------------------------
  # One TypeScript across the whole graph. The catalog governs only our own packages;
  # third-party tools that range-depend on `typescript` (sonarjs, ts-api-utils, the
  # @typescript-eslint chain) resolve it themselves and pick 7.0 — the native rewrite
  # whose root export dropped the classic JS API those tools load eagerly. 6.0 is the
  # last release carrying it. See typescript-eslint#10940; tsgo support is 1-2 majors
  # out, so lifting this is a migration, not a dep bump.
  #
  # `vis update --latest` rewrites the `tsc`/`web` catalogs but not this override, so
  # such a bump installs nothing and only makes the catalog lie. Move all three together.
  typescript: 6.0.3
  # Force a single React across the tree. @visulima/tui (a vis dependency) and its
  # react-reconciler pin react@^19.2.6 while everything else uses 19.2.8; two
  # copies crash vis's TUI renderer ("Invalid hook call" / useContext on null).
  # NOTE: `vis update` bumps the `frontend`/`web` catalogs but NOT this block, so
  # when react moves here, move it there too or the catalog silently lies about
  # what installs (the override always wins).
  react: 19.2.8
  react-dom: 19.2.8
  # Force a single React Native — the version Expo SDK 57 bundles (see the `expo`
  # catalog). react-native's highest published version is `1000.0.0`, an
  # accidentally-published placeholder Meta deprecated ("should not be used in
  # production"), and `@react-three/fiber` / `@tanstack/offline-transactions`
  # declare an open `react-native >=0.78` peer that `autoInstallPeers` resolves
  # to it. That placeholder is a 70 MB 2019-era tree that drags in the legacy
  # @react-native-community/cli and with it `ip@1.1.9` (GHSA-2p57-rm9w-gvfp, high
  # severity, no fixed release), failing the dependency-review gate. Bump this in
  # lockstep with `catalogs.expo`.
  react-native: 0.86.2
  # h3 stays on v1. v2 is a different framework (srvx/rou3 core, `event.req` instead
  # of `toWebRequest`), Nuxt 4 / Nitro 2 run v1, and @lunora/nuxt peers `h3: ^1.15.0`.
  # 2.0.0 is deprecated upstream and 2.0.1 is rc-only, so there is nothing stable to
  # move to.
  #
  # This does NOT touch `h3-v2`, the alias `@tanstack/start-server-core` uses to load
  # v2 beside v1: pnpm matches overrides on the specifier name, not the resolved
  # package, so the alias is out of scope by construction.
  h3: ^1.15.11
  # Force the whole tree onto js-yaml 4 (3.x is unmaintained / flagged by audits).
  # The only 3.x consumer is gray-matter@4.0.3, which calls the removed
  # safeLoad/safeDump — we pnpm-patch it to load/dump (safe by default in v4) so
  # it works on 4.x. See patches/gray-matter@4.0.3.patch. The upper bound keeps
  # this rule intact — an open `>=4.3.1` resolves @expo/xcpretty onto js-yaml 5.
  js-yaml: ">=4.3.1 <5"

  # ---------------------------------------------------------------------------
  # Security advisories — force a patched version where a dependent pins below
  # the fix. Alphabetical, one rule per package (overlapping selectors are
  # ambiguous in pnpm — widen the existing rule instead of adding a second).
  # Almost all live in build/tooling / example-app graphs (nuxt/astro/docs/
  # studio/cli), none in the shipped Cloudflare Worker runtime.
  # ---------------------------------------------------------------------------
  "@hono/node-server@<2.0.5": ^2.0.5
  "@nuxt/devtools@<3.3.1": ^3.3.1
  "@opentelemetry/core@<2.8.0": ^2.8.0
  adm-zip: ">=0.6.0"
  # astro's XSS fix needs a major bump to 7.0.10 — handled separately, it breaks
  # the adapter.
  astro@<6.4.6: ^6.4.6
  axios: ">=1.18.0"
  body-parser: ">=2.3.0"
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  dompurify@<=3.4.10: ^3.4.13
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-xml-parser@<5.7.0: ^5.7.0
  hono@<4.12.34: ^4.12.34
  # react-native's `@react-native/community-cli-plugin` declares an OPTIONAL
  # `@react-native-community/cli: "*"` peer that `autoInstallPeers` resolves to
  # the ancient 13.5.1 (14+ narrows its own react-native peer, so pnpm backtracks).
  # 13.x depends on the unmaintained `ip@1.1.9` — GHSA-2p57-rm9w-gvfp, high
  # severity, no fixed release — which fails the dependency-review gate. v20 drops
  # it. Nothing in the repo calls this CLI; the override just keeps `ip` out.
  "@react-native-community/cli@<20": ^20.2.0
  ip-address@<=10.3.0: ^10.3.1
  js-yaml@<=4.1.1: ^4.3.1
  lodash@<=4.17.23: ^4.17.24
  next@>=16.0.0 <16.2.11: ^16.2.11
  nuxt@>=4.0.0 <4.5.1: ^4.5.1
  postcss@<8.5.10: ^8.5.26
  protobufjs: ">=7.6.5"
  sharp@<0.35.0: ^0.35.0
  shell-quote: ">=1.8.5"
  svgo@>=4.0.0 <4.0.2: ^4.0.2
  tar@<=7.5.20: ^7.5.21
  tmp@<0.2.6: ^0.2.6
  undici@<6.27.0: ^6.28.0
  undici@>=7.0.0 <7.29.0: ^7.29.0
  # dockerode pulls uuid@10, flagged by GHSA-w5hq-g745-h8pq (missing buffer
  # bounds check in v3/v5/v6 when `buf` is passed). dockerode only calls
  # `uuid.v4()`, so it's not exploitable here, but bump the whole tree to the
  # patched line to clear the advisory; v11 keeps the named `v4` export.
  uuid@<11.1.0: ^11.1.0
  # @c15t/schema pins valibot to exactly 1.3.1; <=1.4.1 has a moderate flatten()
  # DoS (GHSA-5qjj-4xww-7phc), fixed in 1.4.2.
  valibot: ">=1.4.2"
  # viem's isows@1.0.7 pulls ws@8.20.1, flagged by GHSA-96hv-2xvq-fx4p (memory-
  # exhaustion DoS from tiny fragments, high severity). Bump the vulnerable 8.x
  # range to the patched 8.21.0 — already resolved elsewhere in the tree (@solana/kit,
  # @lunora/vite) — while leaving the legacy ws@1.x/4.x transitive pins untouched.
  ws@>=8.0.0 <8.21.0: ^8.21.0

  # ---------------------------------------------------------------------------
  # Internal packages → local workspace source. Lives in root overrides (NOT each
  # package's dependencies) so semantic-release-pnpm's per-package range rewrite
  # never clobbers it; published tarballs are unaffected (overrides are
  # install-time).
  # ---------------------------------------------------------------------------
  "@lunora/advisor": "workspace:*"
  "@lunora/agent": "workspace:*"
  "@lunora/ai": "workspace:*"
  "@lunora/angular": "workspace:*"
  "@lunora/astro": "workspace:*"
  "@lunora/auth": "workspace:*"
  "@lunora/bindings": "workspace:*"
  "@lunora/browser": "workspace:*"
  "@lunora/cli": "workspace:*"
  "@lunora/client": "workspace:*"
  "@lunora/cloudflare-access": "workspace:*"
  "@lunora/codegen": "workspace:*"
  "@lunora/config": "workspace:*"
  "@lunora/container": "workspace:*"
  "@lunora/d1": "workspace:*"
  "@lunora/db": "workspace:*"
  "@lunora/dispatch": "workspace:*"
  "@lunora/do": "workspace:*"
  "@lunora/errors": "workspace:*"
  "@lunora/fingerprint": "workspace:*"
  "@lunora/flags": "workspace:*"
  "@lunora/hyperdrive": "workspace:*"
  "@lunora/mail": "workspace:*"
  "@lunora/mcp": "workspace:*"
  "@lunora/notify": "workspace:*"
  "@lunora/nuxt": "workspace:*"
  "@lunora/payment": "workspace:*"
  "@lunora/platform": "workspace:*"
  "@lunora/queue": "workspace:*"
  "@lunora/ratelimit": "workspace:*"
  "@lunora/react": "workspace:*"
  "@lunora/react-native": "workspace:*"
  "@lunora/replica": "workspace:*"
  "@lunora/runtime": "workspace:*"
  "@lunora/scheduler": "workspace:*"
  "@lunora/shard-engine": "workspace:*"
  "@lunora/seed": "workspace:*"
  "@lunora/server": "workspace:*"
  "@lunora/solid": "workspace:*"
  "@lunora/sql-store": "workspace:*"
  "@lunora/storage": "workspace:*"
  "@lunora/studio": "workspace:*"
  "@lunora/svelte": "workspace:*"
  "@lunora/testing": "workspace:*"
  "@lunora/values": "workspace:*"
  "@lunora/vite": "workspace:*"
  "@lunora/vue": "workspace:*"
  "@lunora/workflow": "workspace:*"
  "@lunora/x402": "workspace:*"
  "lunorash": "workspace:*"

catalogs:
  ai:
    # Vercel AI SDK v7 core + Cloudflare's official Workers AI provider. The
    # provider peers `ai ^7.0.0` / `@ai-sdk/provider ^4.0.0` as of its v4.0.0
    # (a peer-range-only major: no API change). Workers AI is the
    # zero-config default; the `@ai-sdk/*` providers below are optional
    # bring-your-own (declared as optional peers on @lunora/ai) so an app stays
    # Workers-AI-only unless it opts into another provider.
    #
    # EXACT-pinned (no caret): v7 shipped inside the 1440-minute maturity window,
    # so each version is allow-listed by exact name@version in
    # `minimumReleaseAgeExclude` below. A caret would let pnpm drift to a newer
    # patch that is NOT excluded and would then be gated. To bump: update the
    # version here AND its matching exclude entry together.
    ai: 7.0.59
    workers-ai-provider: 4.0.0
    "@ai-sdk/anthropic": 4.0.37
    "@ai-sdk/openai": 4.0.37
  build:
    "@babel/core": ^8.0.1
    "@babel/preset-react": ^8.0.1
    "@visulima/packem": 2.0.0
    "babel-plugin-react-compiler": 1.0.0
    "babel-preset-solid": ^1.9.12
    esbuild: ^0.28.2
    "rollup-plugin-svelte": ^7.2.3
    "unplugin-vue": ^7.2.0
  dev:
    "@anolilab/semantic-release-pnpm": ^8.1.18
    "@anolilab/semantic-release-preset": ^13.4.19
    "@semantic-release/exec": ^7.1.0
    "@total-typescript/ts-reset": ^0.6.1
    "@tsconfig/node24": ^24.0.4
    conventional-changelog-conventionalcommits: 9.3.1
    cross-env: ^10.1.0
  lint:
    # Held at 28.0.1: 28.1.x turns on ~20 new `unicorn/*` rules (filename-case,
    # consistent-boolean-name, name-replacements, prefer-await, …) that report
    # 8,194 errors across the repo, most of them renames no autofix can do.
    # Adopting them is its own migration — bump this and the `web` copy together.
    "@anolilab/eslint-config": 28.0.1
    "@anolilab/prettier-config": 10.0.3
    "@typescript-eslint/parser": 8.67.0
    "@eslint-react/eslint-plugin": 5.18.3
    "@ospm/eslint-plugin-react-unhookify": ^1.0.2
    eslint: 10.8.1
    eslint-plugin-jsx-a11y: ^6.10.2
    eslint-plugin-react: ^7.37.5
    eslint-plugin-react-compiler: ^19.1.0-rc.2
    eslint-plugin-react-hooks: 7.1.1
    eslint-plugin-react-perf: ^3.3.3
    eslint-plugin-react-refresh: 0.5.4
    eslint-plugin-svelte: ^3.22.0
    eslint-plugin-vue: ^10.10.0
    svelte-eslint-parser: ^1.8.0
    vue-eslint-parser: ^10.4.1
    "@tanstack/eslint-plugin-query": 5.101.4
    eslint-plugin-react-you-might-not-need-an-effect: 1.0.1
    eslint-plugin-testing-library: 7.16.2
    eslint-plugin-validate-jsx-nesting: ^0.1.1
    fallow: 3.14.0
    husky: ^9.1.7
    prettier: 3.9.6
    prettier-plugin-svelte: 4.1.1
    # Bump `version` in .github/workflows/react-doctor.yml to match. Nothing
    # enforces the pair, and CI running an older tool than the repo installs
    # reports findings a contributor cannot reproduce locally.
    react-doctor: 0.9.11
  node:
    # Exact-pinned (no caret): this is the parser `wrangler dev` runs over
    # `.dev.vars`, and `@lunora/config` reads that file with the same library so
    # the CLI/studio can't disagree with the worker about what a line means.
    # wrangler bundles its own copy rather than resolving ours (4.120.1 ships
    # 16.3.1), so the two versions are independent — they agree today because
    # `parse()` is byte-identical from 16.3.1 through 17.x, which is exactly
    # the thing that could silently stop being true. A dotenv release that
    # changes the grammar is a behaviour change for us, so it gets vetted (the
    # parity fixtures in
    # `packages/config/__tests__/dev-variables-format.test.ts` are the tripwire)
    # rather than floated in on a range.
    dotenv: 16.6.1
    fast-glob: ^3.3.3
    rimraf: 6.1.3
    semver: ^7.8.5
  prod:
    adm-zip: 0.6.0
    csv-parse: 7.0.2
    "@anolilab/commitlint-config": 10.1.0
    "@anolilab/multi-semantic-release": ^4.4.7
    "@anolilab/textlint-config": 13.0.6
    "@commitlint/cli": ^21.2.1
    "@commitlint/config-conventional": ^21.2.0
    cz-conventional-changelog: ^3.3.0
    "@visulima/vis": 3.0.0
    "@visulima/tabular": 4.1.0
    "@visulima/error": 6.1.0
  test:
    "@codspeed/vitest-plugin": 5.7.1
    "@vitest/coverage-v8": 4.1.10
    "@vitest/ui": 4.1.10
    fake-indexeddb: 6.2.5
    vitest: 4.1.10
  tsc:
    # Pinned to 6.0.3 — see the `typescript` override above. Bumping this to 7.x
    # installs nothing (the override wins) and only makes the catalog lie.
    typescript: 6.0.3
  types:
    "@standard-schema/spec": 1.1.0
    "@types/dockerode": ^4.0.1
    "@types/node": 26.2.0
    "@types/semver": ^7.7.1
  cloudflare:
    "@cloudflare/containers": ^0.3.7
    # Exact-pinned: `@lunora/browser` tracks a verified-good Playwright-on-Workers
    # release, and bumps are vetted against a live worker.
    #
    # WARNING: 1.3.5 has only been vetted on types and the local suites (the change from
    # 1.3.0 is additive, and @lunora/browser never imports the package — it takes
    # `launch` by injection). The live-worker leg needs a real Browser Rendering binding
    # on a deployed worker; run it before relying on this in production.
    "@cloudflare/playwright": 1.3.5
    "@cloudflare/vitest-plugin": ^1.0.0
    # PATCHED (patches/@cloudflare__workers-types@5.20260811.1.patch), and the patch
    # is version-pinned in `patchedDependencies` — regenerate it when bumping this.
    # Upstream declares `declare const Buffer: any` / `declare const process: any`,
    # which win over @types/node's `BufferConstructor` / `NodeJS.Process` in every
    # package that loads both type sets (33 of them here; none load workers-types
    # alone). That makes every `process.*` and `Buffer.*` read an untyped `any`,
    # silently disabling `no-unsafe-*` on exactly the two globals most likely to be
    # absent at runtime. The patch drops both declarations so @types/node wins.
    "@cloudflare/workers-types": ^5.20260811.1
    miniflare: ^4.20260730.0
    wrangler: ^4.120.1
  e2e:
    "@playwright/test": ^1.62.1
    playwright: ^1.62.1
  flags:
    # Feature flags (@lunora/flags). OpenFeature is the base abstraction; the
    # Cloudflare Flagship provider is the first-class default. server-sdk is the
    # only required peer for the core; flagship + web-sdk gate the optional
    # provider/browser subpaths.
    "@cloudflare/flagship": ^0.5.0
    "@openfeature/server-sdk": ^1.23.0
    "@openfeature/web-sdk": ^1.10.0
  otel:
    # The OpenTelemetry API surface only — no SDK. `@lunora/server` takes it as an
    # OPTIONAL peer (for the `@lunora/server/otel` subpath) so an app that already
    # has `@opentelemetry/api` keeps exactly one copy: the API relies on a
    # module-global registry, and two instances mean a library's spans register
    # against a provider nobody reads.
    "@opentelemetry/api": ^1.9.1
  tooling:
    # Sqlite driver shared by @lunora/auth (Kysely test adapter) and
    # @lunora/platform-node (the Node host's durable storage).
    "@types/better-sqlite3": ^9.6.0
    "better-sqlite3": ^13.0.3
    # Cron expression parsing shared by @lunora/scheduler and
    # @lunora/platform-node's scheduler host.
    "cron-parser": 5.8.1
    dockerode: ^5.0.1
    # Model-layer renderer for `lunora sdk generate`: JSON Schema -> dataclasses
    # in 19 languages. Only the generated SDK's *models* come from quicktype —
    # the method surface is emitted by `packages/codegen/src/sdk/targets/` and
    # the transport is the hand-written per-language runtime under `sdks/`.
    quicktype-core: ^26.0.0
    ts-morph: ^28.0.0
  # Terminal runtime for the `lunora` binary (@lunora/cli) and the scaffolding it
  # shares with @lunora/config. All @visulima/* are exact-pinned per the repo
  # convention; react-reconciler is the custom renderer behind @visulima/tui.
  cli:
    "@bomb.sh/tab": 0.0.22
    "@visulima/cerebro": 3.0.6
    "@visulima/colorize": 2.1.1
    "@visulima/find-ai-runner": 1.0.1
    "@visulima/fs": 6.0.0
    "@visulima/package": 5.0.12
    "@visulima/pail": 4.1.1
    "@visulima/path": 4.0.0
    "@visulima/spinner": 1.0.1
    # v4 split the library: `@visulima/tui` keeps the runtime (`render`) plus the
    # primitives (`components/box`, `components/text`) and every `hooks/*`, while
    # the widget set moved to `@visulima/tui-kit` at flat subpaths — the CLI's
    # prompts import CommandPalette/ConfirmInput/SelectInput/Spinner/TextInput from
    # there now. tui-kit peers `@visulima/tui` EXACTLY, so bump the two together.
    "@visulima/tui": 4.0.0
    "@visulima/tui-kit": 1.0.3
    cfonts: ^3.3.1
    giget: 3.3.1
    magic-string: ^1.1.0
    react-reconciler: ^0.33.0
    smol-toml: 1.7.1
  vite:
    # Exact-pinned: this plugin has shipped dev-runner regressions before (1.40.0 threw
    # from `getWorkerEntryExportTypes` on the Worker entry, unmentioned in its
    # changelog), and its transitive wrangler/miniflare/workerd can be fresher than the
    # minimumReleaseAge gate allows.
    #
    # To bump: smoke `pnpm --filter "@lunora/vite" dev` against a template, confirm the
    # dev runner boots and serves, and confirm the transitive wrangler/miniflare/workerd
    # are past the release-age window. 1.51.2 was vetted that way.
    "@cloudflare/vite-plugin": 1.51.2
    "@tailwindcss/cli": ^4.3.3
    "@tailwindcss/vite": ^4.3.3
    "@visulima/vite-overlay": 2.0.12
    es-module-lexer: ^2.3.1
    jsonc-parser: ^3.3.1
    tailwindcss: ^4.3.3
    tw-animate-css: ^1.4.0
    vite: ^8.2.1
  data:
    "@faker-js/faker": ^10.5.0
  content:
    # Frontmatter parsing for markdown-authored agent skills
    # (`@lunora/agent/skill-markdown`, a subpath so only apps that use it pay).
    #
    # It is dual CJS/ESM, NOT pure ESM: its `node` condition resolves a CommonJS
    # build that does `require("process")`. What makes it workerd-safe is the
    # resolver, not the package — the Cloudflare Vite plugin's worker conditions
    # (workerd/worker/module/browser) match none of yaml's, so it falls through
    # to `default`, which is the Node-free browser ESM build. An app that adds
    # "node" to its worker `resolve.conditions` would get the CJS one.
    #
    # The tree also carries js-yaml (transitively, via a patched gray-matter in
    # apps/docs). That one is docs tooling; this is the declared runtime dep.
    yaml: ^2.9.0
  i18n:
    "@lingui/core": ^6.6.0
    "@lingui/message-utils": ^6.6.0
  ui:
    "@base-ui/react": 1.7.0
    "@fontsource-variable/geist": ^5.3.0
    "@hugeicons/core-free-icons": ^4.2.3
    "@hugeicons/react": ^1.1.9
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    shadcn: ^4.16.2
    tailwind-merge: ^3.6.0
  frontend:
    # Meta-frameworks the `@lunora/astro` / `@lunora/nuxt` integrations build against.
    astro: 7.2.0
    "@nuxt/kit": ^4.5.2
    html-to-image: ^1.11.13
    motion: ^13.1.0
    recharts: ^3.10.1
    "@solidjs/testing-library": ^0.8.10
    "@tanstack/db": ^0.6.17
    "@tanstack/offline-transactions": ^1.0.42
    "@tanstack/react-db": ^0.1.95
    "@tanstack/react-query": ^5.101.4
    "@tanstack/react-router": ^1.170.25
    "@tanstack/react-start": ^1.168.42
    # Held at v8: v9 rewrote the row-model API (`getCoreRowModel()` /
    # `getSortedRowModel()` as options are gone, replaced by table-core 9 +
    # @tanstack/react-store features). @lunora/studio's data browser is built on
    # the v8 shape, so moving is a migration, not a dep bump.
    "@tanstack/react-table": ^8.21.3
    "@tanstack/react-virtual": ^3.14.9
    "@sveltejs/vite-plugin-svelte": ^7.3.0
    svelte-check: ^4.7.5
    "@testing-library/dom": ^10.4.1
    "@testing-library/jest-dom": ^7.0.1
    "@testing-library/react": ^16.3.2
    "@testing-library/svelte": ^5.4.2
    "@testing-library/vue": ^8.1.0
    "@vitejs/plugin-vue": ^6.0.8
    vue-tsc: ^3.3.9
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.4
    "@xyflow/react": ^12.11.2
    jsdom: ^30.0.1
    react: ^19.2.8
    react-dom: ^19.2.8
    solid-js: ^1.9.14
    svelte: ^5.56.8
