# Consumed by dorny/paths-filter in test.yml / lint.yml to skip jobs when no relevant
# files changed. Keep the globs broad — a false "changed" only costs a CI run; a false
# "unchanged" skips a gate that should have run.
#
# Several filters also list their own checker, workflow and this file. That is
# deliberate: a PR that disables a gate by editing the gate would otherwise match no
# filter, skip the job, and still pass the required check, which only fails on
# `failure`/`cancelled`.

# Anything that can affect a package's build/test graph.
#
# The workflow and this file are listed per the self-listing rule above: the test job
# carries the assertion that some matrix leg still runs on an FTS5-capable Node, so a PR
# that drops that leg by editing the matrix must not be able to skip the job that would
# have caught it.
#
# `shared/**` is in the build graph even though it is not a workspace: those files are
# bundler-inlined into every consumer's dist, and 290 files across 40 packages import
# them by relative path (199 under `src`, 87 under `__tests__`). Their ONLY coverage is
# the package suites this filter gates — `shared/` has no suite of its own — so a
# `shared/`-only PR used to skip `test`, `test-workerd` and `test-mysql` entirely while
# the required check stayed green on `skipped`. That is the widest blast radius in the
# repo getting the least verification.
#
# `protocol/**` for the reason one level over: `protocol/fixtures/*.json` are read at
# runtime by JS suites (`packages/client/__tests__/protocol-conformance.test.ts`,
# `packages/ratelimit/__tests__/middleware.test.ts`), so a fixture edit matched only the
# `sdks` filter and the reference implementation's own assertions never re-ran.
packages: &packages
    - ".github/workflows/test.yml"
    - ".github/file-filters.yml"
    - "**/tsconfig*.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
    - "package.json"
    - "packages/**"
    - "apps/**"
    - "examples/**"
    - "registry/**"
    - "shared/**"
    - "protocol/**"
    - "tools/**"
    - "vis.config.ts"

# Lintable source (eslint + tsc).
# Public-API snapshot guard: anything that can change a covered package's built
# .d.ts surface, plus the snapshots and the tool itself.
api_surface:
    - "packages/**"
    # Inlined, so it is part of the built surface: a `shared/` type that a package
    # re-exports lands in that package's .d.ts, and the dist bytes `dist-production`
    # weighs are the inlined copy. Neither job could see a `shared/`-only change.
    - "shared/**"
    - "api-snapshots/**"
    - "scripts/api-snapshot.js"
    # `dist-production` rides on this same filter, so its checker is listed here
    # too — gutting DEV_MARKERS matched `frontend_lintable` (eslint still ran) but
    # not this one, so the job that would have caught it was skipped and the
    # required check stayed green.
    - "scripts/check-dist-production.js"
    - ".github/workflows/lint.yml"
    - ".github/file-filters.yml"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"

frontend_lintable:
    - "**/*.[tj]{s,sx}"
    - "**/*.{cts,mts,cjs,mjs}"
    - "**/tsconfig*.json"
    - "**/package.json"
    # A project.json decides whether eslint runs a project at all — an nx-shaped
    # target silently turns that gate into a no-op — so an edit to one must reach the
    # job that catches it. Checker, job and this file listed per the rule above.
    - "**/project.json"
    - "scripts/check-project-json-targets.js"
    - ".github/workflows/lint.yml"
    - ".github/file-filters.yml"
    - "pnpm-lock.yaml"

package_json_lintable:
    - "**/package.json"
    - "package.json"
    - ".github/workflows/lint.yml"
    - ".github/file-filters.yml"

# `check-catalog-drift` + `check-peer-catalog-refs` read every workspace manifest and
# the catalogs they reference, so a `pnpm-workspace.yaml` edit matters as much as a
# package.json one.
dependency_manifests:
    - "**/package.json"
    - "package.json"
    - "pnpm-workspace.yaml"
    - "scripts/check-catalog-drift.js"
    - "scripts/check-peer-catalog-refs.js"
    # The same job also holds the PR-title/commitlint type-list comparison, so its
    # three inputs gate it. Without them a PR that edits only the workflow's `types:`
    # block matches `yaml_lintable` (yamllint still runs) and nothing that would
    # notice the drift.
    - "commitlint.config.cjs"
    - "scripts/check-pr-title-types.js"
    - ".github/workflows/semantic-pull-request.yml"
    - ".github/workflows/lint.yml"
    - ".github/file-filters.yml"

# Files a generator owns are regenerated and diffed. The generators read package
# manifests and project metadata, so any of those can stale a committed output.
# `packages/codegen` is the emitter behind every example's committed
# `lunora/_generated` tree — an emit change stales all 13 at once and matches none
# of the manifest globs above, which is how they drifted unnoticed.
#
# `shared/**` for the same reason one level down: those files are not a package,
# they are inlined into each consumer's bundle, so a `shared/` edit reaches the
# emitted output without any `packages/codegen/**` path being touched. That is
# not hypothetical — `shared/schema-snapshot.ts` decides the `LUNORA_SCHEMA_SNAPSHOT`
# literal in every example's `shard.ts`, so a change confined to it stales all 13
# while this job is skipped and its required check stays green.
generated_files:
    - "**/package.json"
    - "**/project.json"
    - "apps/docs/src/data/packages-metadata.json"
    - "apps/docs/scripts/generate-*.js"
    - "scripts/generate-*.js"
    - "scripts/check-generated-files.mjs"
    - "packages/codegen/**"
    - "shared/**"
    - "examples/**"
    # Self-listed, per the rule at the top of this file: the job's own workflow now
    # carries a `build:packages` step the codegen sweep cannot run without. A PR that
    # edited only `lint.yml` to drop it would match `frontend_lintable` (so eslint
    # still ran) but not this filter, so the generated-files job would be skipped and
    # its required check would stay green while the guard it protects was removed.
    - ".github/workflows/lint.yml"
    - ".github/file-filters.yml"

yaml_lintable:
    - "**/*.yml"
    - "**/*.yaml"

# E2E exercises the playground app and the five showcase examples, plus the
# runtime/client/do/auth packages they all run on — and `shared/`, which is inlined
# into every one of those packages and reaches the browser as part of their bundles.
e2e:
    - "apps/playground/**"
    - "examples/**"
    - "tests/e2e/**"
    - "packages/**"
    - "shared/**"
    - "pnpm-lock.yaml"
    - ".github/workflows/test.yml"
    - ".github/file-filters.yml"

# CodSpeed benchmarks: anything that can change a bench result or the selection.
# `vis affected test:bench` narrows further inside the job; this gate only exists so
# docs-only PRs skip the install+build entirely.
benchmarks:
    - "packages/**"
    - "shared/**"
    - "**/tsconfig*.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
    - "package.json"
    - "vis.config.ts"
    - ".github/workflows/codspeed.yml"

# The auth-ui → registry/auth-ui-* copy-sync check.
registry_sync:
    - "packages/auth-ui/**"
    - "registry/**"
    - "scripts/sync-auth-ui-registry.mjs"
    - ".github/workflows/lint.yml"
    - ".github/file-filters.yml"

# Worker size budget. Separate from `packages` per the self-listing rule at the top.
worker_size:
    - "scripts/check-worker-size.js"
    - "worker-size.json"
    - ".github/workflows/test.yml"
    # This file too, or the hole reopens one level up.
    - ".github/file-filters.yml"

# The non-JS SDK conformance suites. `protocol/**` is listed because the golden frames
# under `protocol/fixtures/` ARE the contract those SDKs are tested against: a wire
# change lands there first, and this is the only gate catching a port that drifts off
# it.
sdks:
    - "sdks/**"
    - "protocol/**"
    - "shared/wire-codec.ts"
    - "shared/stable-key.ts"
    # The generator too: a target template hardcodes the runtime's call signatures, so
    # an edit here breaks every generated SDK while every other gate stays green.
    - "packages/codegen/src/sdk/**"
    # And the CLI the job invokes: the generate-and-build step shells out to
    # `sdk generate`, so a change there breaks every leg while matching no filter.
    - "packages/cli/src/commands/sdk/**"
    # The normative codec's base64 and the key composition from `protocol/README.md`
    # §3 — a change to either is a wire change every port must mirror.
    - "shared/base64.ts"
    - "shared/wire-key.ts"
    # The batch transport's entry shape and its `MAX_BATCH_ENTRIES` cap, which every
    # port mirrors as its own literal. `scripts/check-batch-cap-drift.js` reconciles the
    # values; this listing is what re-runs the ports against the fixtures when the
    # entry shape itself moves.
    - "shared/batch-wire.ts"
    - ".github/workflows/test.yml"
    - ".github/file-filters.yml"

# The template scaffold+install+build+typecheck matrix: too slow for every PR, but the
# only gate proving `lunora init` still installs and that the copy-in auth-ui payload
# compiles against a meta-framework's own tsconfig. Both regressions it has caught came
# from packages/registry changes, not from the templates — hence the wide globs.
#
# `packages/**` rather than the cli + auth-ui pair it used to name: the smoke script
# packs EVERY workspace manifest called `@lunora/*` or `lunorash` and writes all of them
# into each scaffold's `overrides` (scripts/template-build-smoke.sh, "Pack all base
# packages"), and `assert_no_registry_lunora` fails the run if any resolves from npm
# instead. So a break in any of the ~50 other packages reaches a scaffold, and the two
# named ones were only the two whose regressions happened to be caught first.
#
# `shared/**` for the same reason as in `packages` above: it is inlined into every one
# of those tarballs.
#
# This does mean the job now runs on most package PRs. That is the trade the header
# rule names — `e2e` and `worker-size` already sit on `packages` for the same reason —
# and it is the only alternative to a gate that is green because it did not run.
templates:
    - "templates/**"
    - "registry/**"
    - "packages/**"
    - "shared/**"
    - "scripts/template-build-smoke.sh"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
    - ".github/workflows/test.yml"
    - ".github/file-filters.yml"

# `MAX_BATCH_ENTRIES` in shared/batch-wire.ts vs the literal every non-JS port and
# protocol/README.md restate. Separate from `sdks` because the reconciliation is a node
# script, not a conformance suite: it must run on a change to any one of the ten copies
# without paying for eight toolchains.
batch_cap:
    - "shared/batch-wire.ts"
    - "protocol/README.md"
    - "sdks/**"
    - "scripts/check-batch-cap-drift.js"
    - ".github/workflows/lint.yml"
    - ".github/file-filters.yml"

# packages/platform-node/docs/index.mdx's capability table vs NODE_CAPABILITIES in
# packages/platform/src/capabilities.ts. Separate from `packages` per the self-listing
# rule at the top.
node_capabilities_docs:
    - "packages/platform/src/capabilities.ts"
    - "packages/platform-node/docs/index.mdx"
    - "scripts/check-node-capabilities-docs.js"
    - ".github/workflows/lint.yml"
    - ".github/file-filters.yml"
