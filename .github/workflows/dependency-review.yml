"name": "Dependency review"
"on":
    "pull_request":
        "branches": ["main", "alpha", "next", "beta", "fix/**"]
        # The review diffs the dependency graph — only manifests, lockfiles,
        # vendored patches, action pins, and the python SDK can change it.
        "paths":
            - "**/package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "patches/**"
            - ".github/workflows/**"
            - "sdks/**"
"permissions": {}
"jobs":
    "dependency-review":
        "permissions":
            "contents": "read"
            "pull-requests": "write"
        "uses": "anolilab/workflows/.github/workflows/dependency-review.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
