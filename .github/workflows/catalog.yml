name: Catalog

# Packs and signs the app catalog's example apps and publishes the signed index
# files as a build artifact. Nothing is published to a release or a host yet: the
# artifact is the end of the first version.
"on": # yamllint disable-line rule:truthy
    "push":
        "branches": ["alpha"]
        "paths":
            - ".github/workflows/catalog.yml"
            - "apps/cloud/catalog/**"
            - "apps/cloud/scripts/catalog/**"
    "workflow_dispatch": {}

"permissions":
    "contents": "read"

"jobs":
    "catalog":
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "env":
            "CATALOG_KEY_ID": "${{ vars.CATALOG_KEY_ID }}"
        "steps":
            - "name": "Checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2

            # Reads the `packageManager` pin from package.json.
            - "name": "Install pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8

            - "name": "Install Node"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": 24
                  "cache": "pnpm"

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            # The only step that reads the signing secret. The key is written to a fixed
            # path in the runner's temp directory with mode 600, used once by the publisher,
            # and removed by the last step whatever happens here.
            - "name": "Publish signed catalog"
              "working-directory": "apps/cloud"
              "env":
                  "CATALOG_SIGNING_KEY": "${{ secrets.CATALOG_SIGNING_KEY }}"
                  "CATALOG_BASE_URL": "${{ vars.CATALOG_BASE_URL }}"
              "run": |
                  set -euo pipefail
                  : "${CATALOG_KEY_ID:?set the CATALOG_KEY_ID repository variable}"
                  : "${CATALOG_BASE_URL:?set the CATALOG_BASE_URL repository variable}"
                  umask 077
                  key_file="${RUNNER_TEMP}/catalog-signing-key.pem"
                  printf '%s\n' "$CATALOG_SIGNING_KEY" > "$key_file"
                  chmod 600 "$key_file"
                  test -s "$key_file"
                  pnpm run catalog:publish publish --apps catalog/apps --key "$key_file" --key-id "$CATALOG_KEY_ID" --base-url "$CATALOG_BASE_URL" --out dist/catalog

            - "name": "Upload catalog"
              "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              "with":
                  "name": "catalog"
                  "path": "apps/cloud/dist/catalog"
                  "if-no-files-found": "error"

            - "name": "Remove signing key"
              "if": "always()"
              "run": |
                  rm -f "${RUNNER_TEMP}/catalog-signing-key.pem"
