"name": "Scorecards supply-chain security"
"on":
    "branch_protection_rule": ~
    "schedule":
        - "cron": "37 14 * * 6"
    "push":
        "branches": ["main", "master", "alpha", "beta"]
"permissions": {}
"jobs":
    "scorecards":
        "permissions":
            "security-events": "write"
            "id-token": "write"
            "actions": "read"
            "contents": "read"
        "uses": "anolilab/workflows/.github/workflows/scorecards.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        "with":
            "branch": "alpha"
            "publish_results": true
