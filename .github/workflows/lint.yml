"name": "Lint"

# Automatic runs on PRs and the merge queue only, never `push` (see test.yml).
"on": # yamllint disable-line rule:truthy
    "pull_request":
        "types": ["opened", "synchronize", "reopened"]
        "branches": ["main", "alpha", "next", "beta", "fix/**"]
    "merge_group": # yamllint disable-line rule:empty-values
    "workflow_dispatch": # yamllint disable-line rule:empty-values

"concurrency":
    "group": "${{ github.workflow }}-${{ github.ref }}"
    "cancel-in-progress": true

"permissions":
    "contents": "read" # to fetch code (actions/checkout)

"jobs":
    "files-changed":
        "name": "Detect what files changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 5
        "outputs":
            "api_surface": "${{ steps.changes.outputs.api_surface }}"
            "batch_cap": "${{ steps.changes.outputs.batch_cap }}"
            "dependency_manifests": "${{ steps.changes.outputs.dependency_manifests }}"
            "frontend_lintable": "${{ steps.changes.outputs.frontend_lintable }}"
            "generated_files": "${{ steps.changes.outputs.generated_files }}"
            "node_capabilities_docs": "${{ steps.changes.outputs.node_capabilities_docs }}"
            "package_json_lintable": "${{ steps.changes.outputs.package_json_lintable }}"
            "registry_sync": "${{ steps.changes.outputs.registry_sync }}"
            "yaml_lintable": "${{ steps.changes.outputs.yaml_lintable }}"
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            # checkout-with-retry absorbs the transient mid-checkout GITHUB_TOKEN 401,
            # so this call needs no retry handling of its own.
            - "name": "Check for file changes"
              "id": "changes"
              "uses": "dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d" # v4.0.1
              "with":
                  "token": "${{ github.token }}"
                  "filters": ".github/file-filters.yml"

    # eslint over the affected graph, its own required check. Type-aware rules need
    # the upstream declarations on disk, so the affected graph is built first (which
    # also codegens the apps' generated dirs via their `codegen` dependsOn).
    "eslint":
        "name": "Lint (eslint)"
        "if": "needs.files-changed.outputs.frontend_lintable == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main
              "with":
                  "fetch-depth": "0"

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # A target declaring an `executor` and no top-level `command` makes vis
            # report "No command configured" and pass, turning that project's eslint
            # into a silent no-op. Runs before the build so the finding cannot be
            # masked by a later step failing.
            - "name": "Check project.json target shapes"
              "run": "pnpm run lint:project-json"

            - "name": "Build affected packages"
              "run": "pnpm run build:affected:packages"

            - "name": "Lint (eslint)"
              "run": "pnpm run lint:affected:eslint"

    # tsc over the affected graph plus the registry typecheck, its own required check.
    # registry/ is not a vis project; it imports @lunora/* and typechecks against the
    # full built dist.
    #
    # The two steps run SEQUENTIALLY: `lint:types:registry` starts with a full
    # `build:packages`, and packem begins by cleaning each `dist/`. Run concurrently,
    # that clean window races the affected typecheck's tsc mid-read and drops a
    # freshly-removed declaration, failing with TS2307.
    "types":
        "name": "Lint (types)"
        "if": "needs.files-changed.outputs.frontend_lintable == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main
              "with":
                  "fetch-depth": "0"

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Build affected packages"
              "run": "pnpm run build:affected:packages"

            - "name": "Typecheck"
              "run": "pnpm run lint:affected:types"

            # Sequential with the step above — see the clean-window race noted there.
            - "name": "Typecheck registry items"
              "run": "pnpm run lint:types:registry"

    # fallow codebase-intelligence over the affected graph: an advisory report of dead
    # code, dupes and complexity drift. fetch-depth 0 so `vis affected` can diff against
    # the base ref.
    "fallow":
        "name": "Lint (fallow)"
        "if": "needs.files-changed.outputs.frontend_lintable == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main
              "with":
                  "fetch-depth": "0"

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # Static source analysis, so no build is needed. `continue-on-error` because
            # fallow exits 1 on any finding and the `--score` script has no gate flag:
            # the report should stay visible without gating the PR.
            - "name": "Run fallow health"
              "continue-on-error": true
              "run": "pnpm run fallow:affected:health"

    # Public-API snapshot guard: re-extract every package's public surface and fail on
    # drift from the committed api-snapshots/*.api.md, so an export change has to land
    # with an explicit `pnpm run api:update`. Builds all packages, not affected-only, to
    # keep the check deterministic.
    "api-surface":
        "name": "Lint (api surface)"
        "if": "needs.files-changed.outputs.api_surface == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Build packages"
              "run": "pnpm run build:packages"

            - "name": "Check public API snapshots"
              "run": "pnpm run api:check"

    # Every other PR job builds `--development`, but only a `build:prod` output is
    # publishable: a dev build ships the React dev JSX runtime and skips NODE_ENV
    # folding, which is what put @lunora/react@1.0.0-alpha.31 on npm broken. Without
    # this job the defect first surfaces in the release, after merge.
    "dist-production":
        "name": "Lint (dist production)"
        "if": "needs.files-changed.outputs.api_surface == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Build packages (production)"
              "run": "pnpm run build:packages:prod"

            - "name": "Verify no development-build artifacts"
              "run": "pnpm run dist:check"

    "prettier":
        "name": "Lint (prettier)"
        "if": "needs.files-changed.outputs.frontend_lintable == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Lint (prettier)"
              "run": "pnpm run lint:prettier"

    "package-json-sort":
        "name": "Lint (package.json sort)"
        "if": "needs.files-changed.outputs.package_json_lintable == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # `--check` writes nothing, names each unsorted file and exits 1 — no
            # write-then-diff gate needed.
            - "name": "Check package.json sort order"
              "run": "pnpm run lint:package-json"

    "secrets":
        "name": "Secrets"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Scan for secrets"
              "run": "pnpm exec vis secrets"

    # The auth-ui-* registry items are generated from @lunora/auth-ui by
    # scripts/sync-auth-ui-registry.mjs. Its own job, on its own `registry_sync` filter:
    # as a step inside `prettier` it was skipped on any PR without a frontend-lintable
    # file and masked whenever an earlier step failed, and drift reached `alpha` anyway.
    "registry-sync":
        "name": "Lint (auth-ui registry sync)"
        "if": "needs.files-changed.outputs.registry_sync == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 10
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Lint (auth-ui registry sync)"
              "run": "pnpm run lint:registry:sync"

    # Guards packages/platform-node/docs/index.mdx's capability table against
    # NODE_CAPABILITIES in packages/platform/src/capabilities.ts. No build needed — the
    # checker imports capabilities.ts directly via Node's TS type stripping.
    "node-capabilities-docs":
        "name": "Lint (node capabilities docs)"
        "if": "needs.files-changed.outputs.node_capabilities_docs == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 10
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Check node capabilities docs match NODE_CAPABILITIES"
              "run": "pnpm run lint:node-capabilities-docs"

    # Both batch caps against the literal each of the eight non-JS ports,
    # protocol/README.md and the offline fixture restate. The ports only ever see a cap
    # as a number they typed once. Over the entry cap, a client's chunk is refused with a
    # terminal 400, which discards those durable writes rather than retrying them; the
    # byte budget is additionally DERIVED from the worker's own request-body cap, so
    # raising that cap stales all nine clients at once with nothing else noticing.
    "batch-cap":
        "name": "Lint (batch cap)"
        "if": "needs.files-changed.outputs.batch_cap == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 10
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Check every copy of the batch caps agrees"
              "run": "pnpm run lint:batch-cap"

    "yaml-lint":
        "name": "Lint (yaml)"
        "if": "needs.files-changed.outputs.yaml_lintable == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Lint YAML files"
              "uses": "ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c" # v3.1.1
              "with":
                  "config_file": ".yamllint.yaml"
                  "file_or_dir": "."
                  "strict": true

    # Cheap repo-consistency guards nothing else covers, sharing one install. Their
    # own job rather than more postinstall gates: a failing postinstall turns every
    # CI job red in its setup step, with the cause invisible in the job that reports it.
    "dependency-manifests":
        "name": "Lint (dependency manifests)"
        "if": "needs.files-changed.outputs.dependency_manifests == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # A dependency hand-pinned outside a catalog in two or more manifests:
            # the copies diverge on the next bump to either one.
            - "name": "Check catalog drift"
              "run": "pnpm run lint:catalog-drift"

            # A `catalog:` in peerDependencies publishes OUR dev pin as the range
            # consumers must satisfy. pnpm only warns on an unmet peer, so this is
            # invisible in this repo and lands on npm users as an ERESOLVE failure.
            - "name": "Check peerDependencies for catalog: refs"
              "run": "pnpm run lint:peer-catalog-refs"

            # The PR-title gate is a REQUIRED check and a squash merge turns the title
            # into the commit message, with no `commit-msg` hook server-side — so its
            # hand-kept type list is the real type gate, and it had drifted from
            # commitlint's in both directions. It cannot be derived in that workflow:
            # `pull_request_target` with no checkout, deliberately.
            - "name": "Check the PR-title gate matches commitlint's types"
              "run": "node scripts/check-pr-title-types.js"

    # Regenerate every committed generator output and fail if the tree moved —
    # `apps/docs/src/data/packages.ts` went stale exactly this way, rewritten on every
    # build with nothing ever comparing. The diff is whole-tree, not scoped to today's
    # output paths, so a generator added later is covered without touching this job.
    #
    # The sweep now includes `lunora codegen` for the 13 examples that commit a
    # `lunora/_generated` tree (all 13 had drifted). That runs the built CLI, so this
    # job builds first — same `build:packages` step and 30-minute budget as the
    # api-surface job. The codegen sweep itself is ~50s on top of the build.
    "generated-files":
        "name": "Lint (generated files)"
        "if": "needs.files-changed.outputs.generated_files == 'true'"
        "needs": "files-changed"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "lint"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # `lunora codegen` runs from packages/lunora/dist/bin.mjs, so the CLI and
            # everything it loads (@lunora/codegen and its deps) must be built first.
            - "name": "Build packages"
              "run": "pnpm run build:packages"

            - "name": "Regenerate generated files and diff"
              "run": "pnpm run lint:generated"

    # Single required check for the Lint workflow.
    "lint-required-check":
        "name": "Check Lint Run"
        "needs":
            [
                "files-changed",
                "eslint",
                "types",
                "fallow",
                "api-surface",
                "dist-production",
                "prettier",
                "package-json-sort",
                "secrets",
                "registry-sync",
                "node-capabilities-docs",
                "batch-cap",
                "yaml-lint",
                "dependency-manifests",
                "generated-files",
            ]
        "if": "always()"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 5
        "steps":
            - "name": "Fail if a dependency failed or was cancelled"
              "if": "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
              "run": "echo 'A dependent lint job failed or was cancelled.' && exit 1"
