# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

"name": "Lint"

"on": # yamllint disable-line rule:truthy
    "push":
        "branches": ["main", "alpha"]
    "pull_request":
        "types": ["opened", "synchronize", "reopened"]

"concurrency":
    "group": "${{ github.workflow }}-${{ github.ref }}"
    "cancel-in-progress": true

"permissions":
    "contents": "read" # to fetch code (actions/checkout)

"jobs":
    "eslint":
        "name": "ESLint"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 20
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
                  # Pulls all commits (needed for `vis affected` base/head SHA resolution)
                  "fetch-depth": 0
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js 22.14"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.14"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm + vis caches"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": |
                      ${{ steps.pnpm-store.outputs.path }}
                      .vis
                  "key": "pnpm-vis-lint-${{ runner.os }}-node22.14-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-vis-lint-${{ runner.os }}-node22.14-
                      pnpm-vis-${{ runner.os }}-node22.14-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm + vis caches"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": |
                      ${{ steps.pnpm-store.outputs.path }}
                      .vis
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Lint (eslint, affected) on PR"
              "if": "github.event_name == 'pull_request'"
              "run": "pnpm run lint:affected:eslint"

            - "name": "Lint (eslint, all) on push"
              "if": "github.event_name != 'pull_request'"
              "run": "pnpm run lint:eslint"

    "prettier":
        "name": "Prettier"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js 22.14"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.14"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm store"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-store-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm store"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Lint (prettier)"
              "run": "pnpm run lint:prettier"

    "secrets":
        "name": "Secrets"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js 22.14"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.14"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm store"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-store-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm store"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Run vis secrets"
              # Scans the workspace using gitleaks-compatible rules.
              # Excludes configured in vis.config.ts under `secrets.walk`.
              "run": "pnpm exec vis secrets"

    "textlint":
        "name": "Textlint"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js 22.14"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.14"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm store"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-store-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm store"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Run textlint on markdown"
              # Falls back to dlx if textlint is not installed directly (the @anolilab/textlint-config
              # entry in the catalog provides the rule pack but the runner binary itself may not be in
              # root devDeps yet).
              "shell": "bash"
              "run": |
                  if pnpm exec --silent textlint --version >/dev/null 2>&1; then
                      pnpm exec textlint "**/*.md" "!**/node_modules/**" "!**/dist/**" "!**/.vis/**" "!**/.task-runner/**"
                  else
                      pnpm dlx -p textlint -p @anolilab/textlint-config textlint "**/*.md" "!**/node_modules/**" "!**/dist/**" "!**/.vis/**" "!**/.task-runner/**"
                  fi

    "package-json-sort":
        "name": "package.json sort check"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js 22.14"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.14"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm store"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-store-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm store"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Check package.json sort order"
              # `vis sort-package-json` writes in place but exits 0 even on drift,
              # so we rely on `git diff --exit-code` to gate. Any leftover diff in
              # tracked package.json files fails the step.
              "shell": "bash"
              "run": |
                  set -euo pipefail
                  pnpm exec vis sort-package-json
                  git diff --exit-code -- '**/package.json' 'package.json'

    "audit":
        "name": "Dependency audit"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 15
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js 22.14"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.14"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm store"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-store-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm store"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Run vis audit"
              # Scans installed dependencies against the OSV database.
              # `--fail-on high` exits non-zero on any high or critical finding;
              # `--usage` restricts reporting to statically-reachable packages
              # so unused transitive deps do not noise the gate.
              "run": "pnpm exec vis audit --fail-on high --usage"
