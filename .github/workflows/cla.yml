"name": "CLA"

# The check is the shared `cla` workflow: it reads the event payload and checks
# nothing out. Bots and collaborators with write access are exempt.
"on": # yamllint disable-line rule:truthy
    "pull_request_target":
        "types":
            - "opened"
            - "reopened"
            - "synchronize"
            - "edited"
    # So the check can be required in a merge queue; the workflow skips it there.
    "merge_group": # yamllint disable-line rule:empty-values

"concurrency":
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    "cancel-in-progress": true

"permissions": {}

"jobs":
    "cla":
        "permissions":
            "contents": "read"
            "pull-requests": "write" # to post the sticky comment with instructions
        "uses": "anolilab/workflows/.github/workflows/cla.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        "with":
            "target-repo": "anolilab/lunora"
