"name": "React Doctor"

"on":
    "pull_request":
        "paths": ["**/*.tsx"]

"permissions":
    "contents": "read"
    "pull-requests": "write"
    # react-doctor publishes a commit status for the scan result; without this
    # it warns "Resource not accessible by integration" and skips the status.
    "statuses": "write"

"jobs":
    "react-doctor":
        "runs-on": "ubuntu-latest"
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              # react-doctor's PR scan compares against the base branch, which needs
              # full history — a shallow clone (default depth 1) makes the diff fail.
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main
              "with":
                  "fetch-depth": "0"
            # SHA-pinned to the commit behind the action's v2.2.7 tag; bump by
            # re-resolving a newer tag to its commit.
            #
            # `version` pins the react-doctor npm tool too — the action otherwise runs
            # `@latest`, which intermittently exited 0 without producing a report.
            #
            # It MUST match `react-doctor` in `catalog:lint` (pnpm-workspace.yaml),
            # which is the version the repo installs and every contributor runs
            # locally. Nothing enforces the pair, and they had drifted two minors
            # apart: CI reported 12 `react-compiler-no-manual-memoization` and 4
            # `exhaustive-deps` findings that do not exist on the installed
            # version — on hand-written memos carrying an in-file rationale — and
            # regenerated them on every `.tsx` pull request. Bump both together.
            #
            # No `github-token` input: the action reads the ambient GITHUB_TOKEN and
            # warns about unexpected inputs if given one. `scope: changed` (the default)
            # derives its base SHA from the PR event, which is what fetch-depth:0 above
            # is for.
            - "uses": "millionco/react-doctor@938008119a288f2fb47c66a69cd9279a21f31784" # react-doctor@v2.2.7
              "with":
                  "version": "0.9.11"
