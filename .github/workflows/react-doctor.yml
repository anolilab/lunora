"name": "React Doctor"

"on":
    "pull_request":
        "paths": ["**/*.tsx"]

"permissions":
    "contents": "read"
    "pull-requests": "write"
    # react-doctor publishes a commit status for the scan result; without this
    # it warns "Resource not accessible by integration" and skips the status.
    "statuses": "write"

"jobs":
    "react-doctor":
        "runs-on": "ubuntu-latest"
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              # react-doctor's PR scan compares against the base branch, which needs
              # full history — a shallow clone (default depth 1) makes the diff fail.
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main
              "with":
                  "fetch-depth": "0"
            # NOTE(security): SHA-pinned to the commit behind the react-doctor@0.5.6
            # tagged release (resolved via `gh api repos/millionco/react-doctor/git/refs/tags/...`).
            # Bump deliberately by re-resolving the tag's commit SHA.
            # Also note: pinning this action SHA does not fully pin the tool if the action
            # internally runs `npx -y react-doctor@latest`; verify and pin that version too.
            #
            # `scope: changed` (the action's default) auto-compares against the
            # PR's base branch via a base SHA derived from the PR event — works
            # for any base (alpha/main/…), so no branch needs to be hardcoded.
            # The fetch-depth:0 checkout above provides the history it needs.
            #
            # No `github-token` input: react-doctor@0.5.6 doesn't accept one
            # (it reads the ambient GITHUB_TOKEN), and passing it triggers an
            # "Unexpected input(s) 'github-token'" warning.
            - "uses": "millionco/react-doctor@15238de7019167e740c9fc08b800d9732c2ab477" # react-doctor@0.5.6
