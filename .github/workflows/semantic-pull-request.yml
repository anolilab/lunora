"name": "Semantic Pull Request"

"on": # yamllint disable-line rule:truthy
    "pull_request_target":
        "types":
            - "opened"
            - "reopened"
            - "edited"
            - "synchronize"
    "merge_group": # yamllint disable-line rule:empty-values

"permissions":
    "contents": "read"

"jobs":
    "semantic-pull-request":
        # The `merge_group` trigger exists only so this required check reports a status
        # in the queue: a job skipped by `if` counts as passing, while a workflow that
        # never triggers leaves the entry stuck on "Expected". The action itself cannot
        # run there — a merge group has no PR to infer — and the title was already
        # validated on the PR and cannot change once queued.
        "if": "github.event_name != 'merge_group'"
        "permissions":
            "pull-requests": "write" # to analyze PRs (amannn/action-semantic-pull-request)
            "statuses": "write" # to mark status of analyzed PR (amannn/action-semantic-pull-request)
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "name": "Semantic Pull Request"
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Validate PR title"
              "id": "lint_pr_title"
              "uses": "amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50" # v6.1.1
              "env":
                  "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
              "with":
                  # commitlint's `type-enum`, verbatim. A squash merge takes the PR
                  # title as the commit message, and the `commit-msg` hook does not
                  # run server-side, so this list IS the type gate for merged work —
                  # and it had drifted in both directions: `infra` passed here and
                  # landed a type semantic-release cannot map, while `deps`,
                  # `security`, `style` and `translation` failed a required check
                  # despite being valid everywhere else in the repo.
                  #
                  # `scripts/check-pr-title-types.js` (the yaml-lint job) fails if
                  # this list and commitlint's ever disagree again.
                  "types": |
                      build
                      chore
                      ci
                      deps
                      docs
                      feat
                      fix
                      perf
                      refactor
                      revert
                      security
                      style
                      test
                      translation

            - "uses": "marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0" # v3.0.4
              "if": "always() && (steps.lint_pr_title.outputs.error_message != null)"
              # Only reached once `lint_pr_title` has already failed, so the comment is
              # a courtesy and must not add a second failure of its own.
              "continue-on-error": true
              "with":
                  "header": "pr-title-lint-error"
                  "message": |
                      Hey there and thank you for opening this pull request! 👋🏼

                      We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted.

                      Details:

                      ```
                      ${{ steps.lint_pr_title.outputs.error_message }}
                      ```

            - "if": "${{ steps.lint_pr_title.outputs.error_message == null }}"
              "uses": "marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0" # v3.0.4
              # The mirror image: this one runs when the title PASSES, so an unreachable
              # comment API here would turn a green check red — as it did on #410, with a
              # self-signed certificate from behind the harden-runner egress proxy.
              "continue-on-error": true
              "with":
                  "header": "pr-title-lint-error"
                  "message": |
                      Thank you for following the naming conventions! 🙏
