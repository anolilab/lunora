"name": "Preview Docs"

# A pull request carrying the `preview-docs` label gets its own copy of the docs site
# (stage `pr-<number>`) in the preview Cloudflare account, redeployed on every push and
# destroyed when the pull request closes or loses the label. Nothing else deploys it.
#
# Same-repository pull requests only: the deploy job holds the preview environment's
# Cloudflare token and runs the pull request's code, which a fork must never do. The
# label is the opt-in, because a full build is slow and every preview is a set of
# billed resources.
#
# The `docs-preview` environment should hold a token for a Cloudflare account that is
# NOT the production one: this code runs with it, so a token that reaches production
# would let any same-repository pull request reach the production Worker and KV.
"on": # yamllint disable-line rule:truthy
    "pull_request":
        "types":
            - "labeled"
            - "unlabeled"
            - "synchronize"
            - "reopened"
            - "closed"

# One run per pull request. deploy-docs.yml serialises its own state under
# `deploy-docs-pr-<number>`; this group must NOT be that one, or caller and callee wait
# on each other forever. `queue: max` keeps every waiting run: with the default only one
# can wait, so a later event (another label, a push) would replace a pending destroy,
# skip both jobs, and leave the preview deployed until the pull request closes.
"concurrency":
    "group": "preview-docs-${{ github.event.pull_request.number }}"
    "cancel-in-progress": false
    "queue": "max"

"permissions": {}

"jobs":
    "deploy":
        "name": "Deploy the preview"
        "if": >-
            github.repository == 'anolilab/lunora'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.action != 'closed'
            && github.event.action != 'unlabeled'
            && contains(github.event.pull_request.labels.*.name, 'preview-docs')
            && (github.event.action != 'labeled' || github.event.label.name == 'preview-docs')
        "permissions":
            "contents": "read"
            "deployments": "write"
        "uses": "./.github/workflows/deploy-docs.yml"
        "with":
            "environment": "preview"
            "stage": "pr-${{ github.event.pull_request.number }}"

    "comment":
        "name": "Comment the preview URL"
        "needs": "deploy"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 5
        "permissions":
            "pull-requests": "write"
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              "with":
                  "egress-policy": "audit"

            - "name": "Post or update the comment"
              "uses": "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
              "env":
                  "WEBSITE_URL": "${{ needs.deploy.outputs.website-url }}"
                  "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              "with":
                  "script": |
                      const marker = "<!-- docs-preview -->";
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const sha = context.payload.pull_request.head.sha.slice(0, 7);
                      const url = process.env.WEBSITE_URL;

                      const body = [
                          marker,
                          `**Docs preview** for \`${sha}\`: ${url ? url : "deployed (the run did not report a URL)"}`,
                          "",
                          "A full copy of the site in the preview account. Its waitlist form uses Cloudflare's test Turnstile keys and a KV namespace of its own.",
                          "",
                          `[Deploy run](${process.env.RUN_URL}). It is destroyed when this pull request closes or loses the \`preview-docs\` label.`,
                      ].join("\n");

                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                      const existing = comments.find((comment) => comment.body?.startsWith(marker));

                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }

    "destroy":
        "name": "Destroy the preview"
        "if": >-
            github.repository == 'anolilab/lunora'
            && github.event.pull_request.head.repo.full_name == github.repository
            && (github.event.action == 'closed'
            || (github.event.action == 'unlabeled' && github.event.label.name == 'preview-docs'))
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "environment": "docs-preview"
        "permissions":
            "contents": "read"
            "pull-requests": "write"
        "env":
            "STAGE": "pr-${{ github.event.pull_request.number }}"
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              "with":
                  "egress-policy": "audit"

            # The code that deployed it: the stage's resource list comes from
            # `alchemy.run.ts`, and the merge ref of a merged pull request is gone. The
            # head ref, unlike the head branch, survives a squash merge that deletes the branch.
            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              "with":
                  "persist-credentials": "false"
                  "ref": "refs/pull/${{ github.event.pull_request.number }}/head"

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              "with":
                  "node-version": "22.22"
                  "cache-prefix": "deploy-docs"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "npm-version": "11"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # A destroy reads the stage's state and deletes what it lists: it builds
            # nothing and the deploy-only checks in alchemy.run.ts stand down. The
            # secret is read at module load either way, so it is bound to the test
            # value a preview deployed with.
            - "name": "Destroy the stage"
              "working-directory": "apps/docs"
              "env":
                  "CI": "true"
                  "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}"
                  "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
                  "ALCHEMY_PASSWORD": "${{ secrets.ALCHEMY_PASSWORD }}"
                  "ALCHEMY_STATE_TOKEN": "${{ secrets.ALCHEMY_STATE_TOKEN }}"
                  "TURNSTILE_SECRET_KEY": "1x0000000000000000000000000000000AA"
              "run": |
                  pnpm exec alchemy destroy --stage "$STAGE"

            - "name": "Update the comment"
              "uses": "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
              "with":
                  "script": |
                      const marker = "<!-- docs-preview -->";
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;

                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                      const existing = comments.find((comment) => comment.body?.startsWith(marker));

                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: `${marker}\nThe preview was destroyed.` });
                      }
