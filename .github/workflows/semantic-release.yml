# Releases every publishable package with `vis release` — the `release` block in
# vis.config.ts is the whole configuration.
#
# The FILENAME is load-bearing and must not change: npm's trusted publishers are
# registered per package against `semantic-release.yml` (see
# scripts/publish-name-placeholder.mjs), so renaming this file breaks publishing for
# every package until all 57 trusted-publisher entries are updated.

"name": "Release"

"on": # yamllint disable-line rule:truthy
    "push":
        # main → stable releases; alpha/next/beta → prereleases, per the channel
        # table in `release.channels`.
        "branches": ["main", "alpha", "next", "beta"]
    "workflow_dispatch":
        "inputs":
            # A dispatch carries no `github.event.before`, and there is no safe way to
            # guess one: any baseline narrower than the real one silently drops every
            # earlier unreleased commit from the change file, the version and the
            # changelog. So the operator states it. Find it with
            # `git describe --tags --abbrev=0 <branch>` — the tag of that branch's last
            # release.
            "base":
                "description": "Release the commits AFTER this commit-ish (exclusive) — normally the last release tag, e.g. @lunora/cli@1.0.0-alpha.245."
                "required": true
                "type": "string"

# Never cancel an in-progress release (GitHub may still replace a run that is only
# pending). A run cancelled after publishing but before its tag push leaves versions on
# npm with no git tag, and those tags then have to be created by hand.
"concurrency":
    "group": "${{ github.workflow }}-${{ github.ref }}"
    "cancel-in-progress": false

"permissions":
    "contents": "read" # for checkout

"jobs":
    "release":
        "name": "Release"
        "if": "github.repository == 'anolilab/lunora'"
        "runs-on": "ubuntu-latest"
        # 30 minutes was cut off mid-release (run 37775172245 was killed at 30m24s, after the lunorash tag was
        # pushed and before its channel note). The tag then looked "never released" to every later run (#1054).
        "timeout-minutes": 60
        # Gate npm publishing behind a GitHub Environment so secrets are scoped and
        # required-reviewer rules (configured in repo settings) can apply.
        "environment": "release"
        "permissions":
            "contents": "write" # to publish a GitHub release + push lockfile sync
            "issues": "write" # to comment on released issues
            "pull-requests": "write" # to comment on released pull requests
            "id-token": "write" # to enable OIDC for npm provenance
            "actions": "write" # to dispatch the CodSpeed baseline run below

        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              # SECURITY TODO: this job holds NPM_TOKEN + a GitHub PAT, and `audit` only
              # logs egress. Switching to `block` needs an allowlist confirmed from a real
              # audit run — an incomplete one breaks the release. Known-required hosts:
              # registry.npmjs.org, github.com, api.github.com, objects.githubusercontent.com.
              "with":
                  "egress-policy": "audit"

            # Persist credentials so vis can push tags and this job the release commit.
            - "name": "Git checkout" # zizmor: ignore[artipacked]
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "fetch-depth": 0
                  "token": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  # No "version" — the action reads the pinned pnpm from package.json's
                  # `packageManager` field, so CI can't drift from the repo's version.
                  "run_install": false

            - "name": "Use Node.js 22.22"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.22"
                  "registry-url": "https://registry.npmjs.org"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm store"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "pnpm-store-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-store-release-${{ runner.os }}-
                      pnpm-store-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm store"
              "if": "steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Build packages"
              # dist/ is what gets published, so it has to exist before the release.
              # `build:prod`, never `build`: a development build ships the React dev JSX
              # runtime and crashes consumers whose bundler stubs it — shipped once already,
              # as @lunora/react@1.0.0-alpha.31.
              "run": "pnpm run build:packages:prod"

            - "name": "Verify no development-build artifacts"
              "run": "pnpm run dist:check"

            # `prepare` installed the vis hooks during install; they must not run on the
            # machine-made tag and release-commit pushes for the rest of this job.
            - "name": "Disable git hooks for release commits"
              "run": "git config core.hooksPath /dev/null"

            # `vis release` is change-file driven (changesets-style), so a commit-driven release
            # writes one first. It stays uncommitted: the release step consumes it and the push
            # step commits what that wrote.
            #
            # The baseline is exclusive (`generate` runs `git log <from>..HEAD`) and is
            # never guessed:
            #
            #   push     — `github.event.before`, the branch tip this push replaced, so the
            #              range is exactly "the commits this push added".
            #   dispatch — the required `base` input.
            #
            # Anything else fails the job: a force-push whose old tip is gone, a branch's
            # first push, an unresolvable input. A `HEAD~1` fallback looks like a safe
            # default and is not — a dispatch after N unreleased commits would release only
            # the last one, and the commits it skipped are unrecoverable: no change file is
            # ever written for them, so the version and the changelog lose them for good.
            # Failing is recoverable; under-releasing is not.
            - "name": "Derive change files from this push"
              "shell": "bash"
              "env":
                  "BASE": "${{ inputs.base }}"
                  "BEFORE": "${{ github.event.before }}"
              "run": |
                  set -euo pipefail

                  if [ -n "${BASE:-}" ]; then
                      ref="${BASE}"
                      origin="the 'base' input"
                  else
                      ref="${BEFORE:-}"
                      origin="github.event.before"
                  fi

                  from=""

                  if [ -n "${ref}" ]; then
                      from="$(git rev-parse --verify --quiet "${ref}^{commit}" || true)"
                  fi

                  if [ -z "${from}" ]; then
                      echo "::error::No release baseline: ${origin} is '${ref:-unset}', which this checkout cannot resolve to a commit. Re-run this workflow from the Actions tab with 'base' set to the last released commit-ish on this branch (git describe --tags --abbrev=0). Refusing to guess one: a guessed baseline drops every earlier unreleased commit from the version and the changelog, and nothing recovers them."
                      exit 1
                  fi

                  echo "Releasing ${from}..HEAD (baseline from ${origin})."

                  pnpm exec vis release generate --from "${from}" --name "ci-$(git rev-parse --short HEAD)"

            # Versions, writes changelogs, publishes, then tags the checked-out commit and
            # pushes the tags — but commits nothing and never pushes the branch; the next
            # step does that once. See the header of scripts/vis-release.mjs for why this is
            # not `vis release ci release --auto-publish`.
            - "name": "Release"
              "env":
                  "GH_TOKEN": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
                  "GITHUB_TOKEN": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
                  "NPM_TOKEN": "${{ secrets.NPM_TOKEN }}"
                  "VIS_GH_TOKEN": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
                  # The release tags are annotated, so `git tag -a` needs an identity.
                  "GIT_AUTHOR_NAME": "github-actions-shell"
                  "GIT_AUTHOR_EMAIL": "github-actions[bot]@users.noreply.github.com"
                  "GIT_COMMITTER_NAME": "github-actions-shell"
                  "GIT_COMMITTER_EMAIL": "github-actions[bot]@users.noreply.github.com"
              "run": "node scripts/vis-release.mjs"

            # The release step only tags and publishes; its bumps are pushed here as ONE commit:
            # each push to the branch rebuilds every merge-queue group, and a commit per package
            # re-ran full CI ~40 times per release.
            #
            # The tags stay on the checked-out commit, which is already on the branch, so a lost
            # push or a killed job can never leave a tag that `git tag --merged` misses (#1054).
            #
            # Retried against a re-fetched tip because the branch moves underneath the job:
            # a release takes ~15 minutes, and a PR merged in that window makes a single
            # push lose the race non-fast-forward. Resolving after the reset also means the
            # lockfile matches whatever else landed meanwhile.
            #
            # `!cancelled()`, not `success()`: a release that failed partway still pushed the
            # tags it completed, so their bumps need to land more then, not less.
            - "name": "Push the release commit"
              "if": "!cancelled()"
              "shell": "bash"
              # --ignore-scripts keeps postinstall away from the release token. hooksPath is
              # re-neutralised below because the step that disables the hooks is skipped when
              # an earlier step failed.
              "env":
                  "BRANCH": "${{ github.ref_name }}"
                  "GIT_AUTHOR_NAME": "github-actions-shell"
                  "GIT_AUTHOR_EMAIL": "github-actions[bot]@users.noreply.github.com"
                  "GIT_COMMITTER_NAME": "github-actions-shell"
                  "GIT_COMMITTER_EMAIL": "github-actions[bot]@users.noreply.github.com"
              "run": |
                  set -euo pipefail

                  git config core.hooksPath /dev/null

                  released=()
                  for manifest in packages/*/package.json; do
                      dir="$(dirname "${manifest}")"
                      tag="$(jq -r '"\(.name)@\(.version)"' "${manifest}")"

                      # Only a bump whose tag exists. A package that failed to publish is NOT
                      # retried by the next run — its change file was consumed — so the job fails
                      # (see the release step) and someone re-dispatches with `base` set to this
                      # run's baseline; the packages that did publish then release once more.
                      if git diff --quiet -- "${dir}/package.json" || ! git rev-parse --quiet --verify "refs/tags/${tag}" > /dev/null; then
                          continue
                      fi

                      git add -- "${dir}/package.json" "${dir}/CHANGELOG.md"
                      released+=("${tag}")
                  done

                  release_commit=""
                  if (( ${#released[@]} > 0 )); then
                      # No release notes in the body: this commit falls inside every released
                      # package's next range, where a quoted `BREAKING CHANGE:` would count.
                      git commit --quiet \
                          --message "chore(release): publish ${#released[@]} package(s) [skip ci]" \
                          --message "$(printf '%s\n' "${released[@]}")"
                      release_commit="$(git rev-parse HEAD)"

                      # Saved for the artifact below: if nothing lands, this commit dies with the
                      # runner and the run's changelogs with it (a re-run sees the tags, releases nothing).
                      git format-patch -1 --stdout "${release_commit}" > "${RUNNER_TEMP}/release-commit.patch"
                  fi

                  for attempt in 1 2 3 4 5; do
                      git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
                      git reset --hard "origin/${BRANCH}"

                      if [[ -n "${release_commit}" ]] && ! git cherry-pick "${release_commit}"; then
                          echo "::error::The release commit conflicts with ${BRANCH}. Its tags are pushed; 'git am' the release-commit artifact by hand, then refresh pnpm-lock.yaml."
                          exit 1
                      fi

                      pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

                      # Lint and Tests never run on push, so nothing else checks the tip a
                      # release creates. Without this, a lockfile the branch cannot install
                      # surfaces one push later, in an unrelated job's setup step.
                      if ! pnpm install --frozen-lockfile --lockfile-only --ignore-scripts; then
                          echo "::error::pnpm-lock.yaml still fails --frozen-lockfile after regeneration (mismatch above). Not pushing it."
                          exit 1
                      fi

                      if ! git diff --quiet -- pnpm-lock.yaml; then
                          git add -- pnpm-lock.yaml

                          if [[ -n "${release_commit}" ]]; then
                              git commit --quiet --amend --no-edit
                          else
                              git commit --quiet --message "chore(deps): sync pnpm-lock.yaml with released manifests [skip ci]"
                          fi
                      elif [[ -z "${release_commit}" ]]; then
                          echo "Nothing released and pnpm-lock.yaml already matches the manifests on ${BRANCH}."
                          exit 0
                      fi

                      if git push origin "HEAD:refs/heads/${BRANCH}"; then
                          rm -f "${RUNNER_TEMP}/release-commit.patch"
                          echo "Pushed the release commit on attempt ${attempt}."
                          exit 0
                      fi

                      echo "Push rejected — ${BRANCH} moved during the release. Retrying."
                      sleep "$((attempt * 5))"
                  done

                  echo "::error::Could not push the release commit after 5 attempts. Its tags are pushed; 'git am' the release-commit artifact (if any) by hand, run 'pnpm install --lockfile-only --no-frozen-lockfile' and push."
                  exit 1

            - "name": "Upload the unpushed release commit"
              "if": "failure()"
              "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              "with":
                  "name": "release-commit"
                  "path": "${{ runner.temp }}/release-commit.patch"
                  "if-no-files-found": "ignore"

            # Every commit this job pushes carries `[skip ci]`, so GitHub dispatches no
            # workflows for them and CodSpeed records no benchmark run at the new head.
            # Its next PR report then finds no baseline on the branch, silently falls
            # back to the last commit that did have one, and attributes everything that
            # landed in between to the PR — a red "regression" in packages the PR never
            # touched. Ask for a run on the new head explicitly.
            #
            # `codspeed.yml` already accepts `workflow_dispatch`, and its benchmark job
            # is written to run when `files-changed` is skipped, which is what happens
            # on a dispatch. Only the branches its `push:` trigger covers are worth
            # dispatching — the others have no baseline to keep fresh.
            - "name": "Refresh the CodSpeed baseline"
              "if": "!cancelled() && (github.ref_name == 'main' || github.ref_name == 'alpha')"
              "shell": "bash"
              "env":
                  "BRANCH": "${{ github.ref_name }}"
                  "GH_TOKEN": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
              # Advisory: a missing baseline costs a noisy PR report, not a broken
              # release, so this must never fail the job that just published.
              "continue-on-error": true
              "run": |
                  set -euo pipefail

                  git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"

                  head="$(git rev-parse "origin/${BRANCH}")"

                  echo "Dispatching a CodSpeed run for ${BRANCH} at ${head}."
                  gh workflow run codspeed.yml --ref "${BRANCH}"
