# Keep this filename: npm's trusted publishers are registered per package against
# `semantic-release.yml` (see scripts/publish-name-placeholder.mjs).

"name": "Release"

"on": # yamllint disable-line rule:truthy
    "push":
        # main → stable releases; alpha/next/beta → prereleases, per the channel
        # table in `release.channels`.
        "branches": ["main", "alpha", "next", "beta"]
    "workflow_dispatch":
        "inputs":
            # Overrides the derived baseline (this branch's last release tag).
            "base":
                "description": "Release the commits AFTER this commit-ish (exclusive). Empty = since this branch's last release tag."
                "required": false
                "type": "string"

# One group for every branch: alpha and main runs push tags and publish the same
# packages, so they must not overlap. Never cancel a running release; a replaced
# pending run loses nothing, the next run starts from the last release tag.
"concurrency":
    "group": "${{ github.workflow }}"
    "cancel-in-progress": false

"permissions":
    "contents": "read" # for checkout

"jobs":
    "release":
        "name": "Release"
        "if": "github.repository == 'anolilab/lunora'"
        "runs-on": "ubuntu-latest"
        # 30 minutes was cut off mid-release (run 37775172245 was killed at 30m24s, after the lunorash tag was
        # pushed and before its channel note). The tag then looked "never released" to every later run (#1054).
        "timeout-minutes": 60
        # Gate npm publishing behind a GitHub Environment so secrets are scoped and
        # required-reviewer rules (configured in repo settings) can apply.
        "environment": "release"
        "permissions":
            "contents": "write" # to push the release commit + tags and create GitHub releases
            "issues": "write" # successWalk: comment on + label released issues
            "pull-requests": "write" # successWalk: comment on + label released pull requests
            "id-token": "write" # to enable OIDC for npm provenance
            "actions": "write" # to dispatch the CodSpeed baseline run below

        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              # SECURITY TODO: this job holds NPM_TOKEN + a GitHub PAT, and `audit` only
              # logs egress. Switching to `block` needs an allowlist confirmed from a real
              # audit run — an incomplete one breaks the release. Known-required hosts:
              # registry.npmjs.org, github.com, api.github.com, objects.githubusercontent.com.
              "with":
                  "egress-policy": "audit"

            # Persist credentials so vis can push the release commit and tags.
            - "name": "Git checkout" # zizmor: ignore[artipacked]
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "fetch-depth": 0
                  # The branch tip, not the pushed sha: a run queued behind a release must start
                  # from that release's commit.
                  "ref": "${{ github.ref_name }}"
                  "token": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  # No "version" — the action reads the pinned pnpm from package.json's
                  # `packageManager` field, so CI can't drift from the repo's version.
                  "run_install": false

            - "name": "Use Node.js 22.22"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.22"
                  "registry-url": "https://registry.npmjs.org"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm store"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "pnpm-store-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-store-release-${{ runner.os }}-
                      pnpm-store-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm store"
              "if": "steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": "${{ steps.pnpm-store.outputs.path }}"
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Build packages"
              # dist/ is what gets published, so it has to exist before the release.
              # `build:prod`, never `build`: a development build ships the React dev JSX
              # runtime and crashes consumers whose bundler stubs it — shipped once already,
              # as @lunora/react@1.0.0-alpha.31.
              "run": "pnpm run build:packages:prod"

            - "name": "Verify no development-build artifacts"
              "run": "pnpm run dist:check"

            # `prepare` installed the vis hooks during install; they must not run on the
            # machine-made tag and release-commit pushes for the rest of this job.
            - "name": "Disable git hooks for release commits"
              "run": "git config core.hooksPath /dev/null"

            # From this channel's own last tag (alpha can reach main's), not `github.event.before`:
            # cancelled queued runs would otherwise leave their commits without a change file.
            - "name": "Resolve the release baseline"
              "id": "baseline"
              "shell": "bash"
              "env":
                  "BASE": "${{ inputs.base }}"
                  "BRANCH": "${{ github.ref_name }}"
              "run": |
                  set -euo pipefail

                  if [ -n "${BASE:-}" ]; then
                      ref="${BASE}"
                      origin="the 'base' input"
                  else
                      case "${BRANCH}" in
                          alpha | beta) match=(--match "*@*-${BRANCH}.*") ;;
                          *) match=(--match "*@*" --exclude "*-alpha.*" --exclude "*-beta.*") ;;
                      esac

                      ref="$(git describe --tags --abbrev=0 "${match[@]}" HEAD 2> /dev/null || true)"
                      origin="the last ${BRANCH} release tag"
                  fi

                  from=""

                  if [ -n "${ref}" ]; then
                      from="$(git rev-parse --verify --quiet "${ref}^{commit}" || true)"
                  fi

                  if [ -z "${from}" ]; then
                      echo "::error::No release baseline: ${origin} is '${ref:-unset}', which this checkout cannot resolve to a commit. Re-run this workflow from the Actions tab with 'base' set to the last released commit-ish on this branch."
                      exit 1
                  fi

                  echo "Releasing ${from}..HEAD (baseline from ${origin}: ${ref})."
                  echo "from=${from}" >> "${GITHUB_OUTPUT}"

            # Writes one change file per package, versions, pushes ONE release commit (rebased
            # and retried if the branch moved; each push rebuilds every merge-queue group), then
            # publishes and pushes the tags. Versions a partly failed earlier run left
            # unpublished are published first (`--publish-missing`, on by default).
            - "name": "Release"
              "env":
                  "FROM": "${{ steps.baseline.outputs.from }}"
                  "GH_TOKEN": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
                  "GITHUB_TOKEN": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
                  "NPM_TOKEN": "${{ secrets.NPM_TOKEN }}"
                  "VIS_GH_TOKEN": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
                  # The release tags are annotated, so `git tag -a` needs an identity.
                  "GIT_AUTHOR_NAME": "github-actions-shell"
                  "GIT_AUTHOR_EMAIL": "github-actions[bot]@users.noreply.github.com"
                  "GIT_COMMITTER_NAME": "github-actions-shell"
                  "GIT_COMMITTER_EMAIL": "github-actions[bot]@users.noreply.github.com"
              "run": 'pnpm exec vis release ci release --auto-publish --generate --generate-from "${FROM}" --verbose'

            # Every commit this job pushes carries `[skip ci]`, so GitHub dispatches no
            # workflows for them and CodSpeed records no benchmark run at the new head.
            # Its next PR report then finds no baseline on the branch, silently falls
            # back to the last commit that did have one, and attributes everything that
            # landed in between to the PR — a red "regression" in packages the PR never
            # touched. Ask for a run on the new head explicitly.
            #
            # `codspeed.yml` already accepts `workflow_dispatch`, and its benchmark job
            # is written to run when `files-changed` is skipped, which is what happens
            # on a dispatch. Only the branches its `push:` trigger covers are worth
            # dispatching — the others have no baseline to keep fresh.
            - "name": "Refresh the CodSpeed baseline"
              "if": "!cancelled() && (github.ref_name == 'main' || github.ref_name == 'alpha')"
              "shell": "bash"
              "env":
                  "BRANCH": "${{ github.ref_name }}"
                  "GH_TOKEN": "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
              # Advisory: a missing baseline costs a noisy PR report, not a broken
              # release, so this must never fail the job that just published.
              "continue-on-error": true
              "run": |
                  set -euo pipefail

                  git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"

                  head="$(git rev-parse "origin/${BRANCH}")"

                  echo "Dispatching a CodSpeed run for ${BRANCH} at ${head}."
                  gh workflow run codspeed.yml --ref "${BRANCH}"
