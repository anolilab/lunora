# Nightly full-suite verification: PRs only run `vis affected`, so unchanged
# packages go stale between merges. Everything here runs unfiltered — every
# package's tests, all workerd suites, e2e. Never a required check; a nightly
# failure is a canary, not a blocker.

"name": "Nightly"

"on": # yamllint disable-line rule:truthy
    "schedule":
        # 03:00 UTC daily — after the day's merges, before the EU morning.
        - "cron": "0 3 * * *"
    "workflow_dispatch": # yamllint disable-line rule:empty-values

"concurrency":
    "group": "${{ github.workflow }}-${{ github.ref }}"
    "cancel-in-progress": true

"permissions":
    "contents": "read" # to fetch code (actions/checkout)

"jobs":
    "test-full":
        "name": "Full test suite (node-${{ matrix.node_version }})"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 60
        "strategy":
            "fail-fast": false
            "matrix":
                "node_version": ["22.15", "24.11"]
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "${{ matrix.node_version }}"
                  "cache-prefix": "nightly"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # Full build, not `affected`, so every package's dist exists.
            - "name": "Build packages"
              "run": "pnpm run build:packages"

            # workerd stays off (the job below covers it) and no coverage is
            # collected — this is a pass/fail canary, and Codecov is fed by test.yml.
            - "name": "Run all tests"
              "run": "pnpm run test"

    # Same design as test.yml's `test-workerd` job — see the comments there.
    "test-workerd":
        "name": "Workerd integration (${{ matrix.package }})"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 20
        "strategy":
            "fail-fast": false
            "matrix":
                "package": ["auth", "client", "container", "d1", "do", "queue", "runtime", "scheduler", "storage", "workflow", "x402"]
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "test-workerd"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "name": "Build package and dependencies"
              "run": |
                  pnpm exec vis run build --query "project=${{ matrix.package }}"

            - "name": "Run workerd suites"
              "env":
                  "LUNORA_WORKERD_TESTS": "1"
              "run": |
                  pnpm --filter "@lunora/${{ matrix.package }}" run test --project workerd

    # test.yml's `e2e` without the paths-filter gate.
    "e2e":
        "name": "E2E (Playwright + Miniflare)"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "e2e"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # See test.yml for why the packages build first and why the build and
            # the browser download overlap.
            - "parallel":
                  - "name": "Build packages"
                    "run": "pnpm run build:packages"

                  - "name": "Install Playwright browsers"
                    "run": "pnpm --filter @lunora/e2e exec playwright install chromium firefox"

            - "name": "Run E2E suite"
              "env":
                  "CI": "true"
                  "LUNORA_E2E": "true"
              "run": "pnpm e2e"

            - "name": "Upload Playwright report on failure"
              "if": "failure()"
              "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              "with":
                  "name": "playwright-report"
                  "path": "tests/e2e/playwright-report"
                  "retention-days": 7

    # The control-plane suite is separate from `e2e` above because it boots a
    # different app (`apps/cloud`) behind its own Playwright config, and a cold
    # Vite start for it is minutes rather than seconds. Nightly only: it is far
    # too slow to gate a PR, and until now it ran nowhere at all, which is how a
    # browser suite quietly rots.
    "e2e-cloud":
        "name": "E2E — control plane (Playwright)"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 45
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "e2e-cloud"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            - "parallel":
                  - "name": "Build packages"
                    "run": "pnpm run build:packages"

                  - "name": "Install Playwright browsers"
                    "run": "pnpm --filter @lunora/e2e exec playwright install chromium"

            # The suite writes its own `.dev.vars` when the app has none and skips
            # with a stated reason if it cannot boot — so a missing secret is a
            # skipped run, never a false red.
            - "name": "Run control-plane E2E"
              "env":
                  "CI": "true"
                  "LUNORA_E2E": "true"
              "run": "pnpm --filter @lunora/e2e run e2e:cloud"

            - "name": "Upload Playwright report on failure"
              "if": "failure()"
              "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              "with":
                  "name": "playwright-report-cloud"
                  "path": "tests/e2e/playwright-report-cloud"
                  "retention-days": 7

    # On PRs this matrix is path-gated and the filter excludes `packages/**`, since a
    # 40-minute job would fire on nearly every PR. But that is exactly where the drift
    # comes from — the `vue-demi` build script that broke every scaffold's first
    # install arrived as a transitive dependency of @lunora/client. So the unfiltered
    # run belongs here, where a failure is a canary rather than a blocker.
    "templates-full":
        "name": "Template scaffold matrix"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 90
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main

            - "name": "Setup resources and environment"
              "uses": "anolilab/workflows/step/node@acba5fb15ac98ad23dec1ad233e40e1bb79c1dae" # v19.0.4
              "with":
                  "node-version": "22.15"
                  "cache-prefix": "nightly-templates"
                  "install-node-gyp": "true"
                  "skip-playwright": "true"
                  "enable-nx-cache": "false"
                  "run-npm-audit": "false"
                  "run-signatures-audit": "false"

            # `:prod` because the matrix packs `dist/` into tarballs, and a development
            # build keeps `react/jsx-dev-runtime`, killing a Next production prerender
            # with `jsxDEV is not a function`.
            - "name": "Build packages (production artifacts)"
              "run": "pnpm run build:packages:prod"

            - "name": "Run the template scaffold matrix"
              "run": "pnpm run test:templates"

            - "name": "Upload scaffold logs on failure"
              "if": "failure()"
              "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              "with":
                  "name": "template-smoke-logs"
                  "path": ".template-smoke-logs"
                  "retention-days": 7
                  "if-no-files-found": "ignore"
