"name": "AI Moderator"
"on": # yamllint disable-line rule:truthy
    "issues":
        "types": ["opened"]
    "issue_comment":
        "types": ["created"]
    "pull_request_review_comment":
        "types": ["created"]

"permissions":
    "models": "read"

"jobs":
    "spam-detection":
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "permissions":
            "issues": "write"
            "pull-requests": "write"
            "models": "read"
            "contents": "read"
        "steps":
            - "name": "Git checkout"
              "uses": "anolilab/workflows/step/checkout-with-retry@6c16895f4c3b5273b373656988505d1a8264e78b" # main
            # https://github.com/github/ai-moderator
            - "uses": "github/ai-moderator@81159c370785e295c97461ade67d7c33576e9319" # v1.1.4
              "with":
                  "token": "${{ secrets.GITHUB_TOKEN }}"
                  "ai-label": "possible-ai-content"
