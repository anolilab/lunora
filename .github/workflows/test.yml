# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

"name": "Tests"

"on": # yamllint disable-line rule:truthy
    "push":
        "branches": ["main", "alpha", "next", "beta"]
    "pull_request":
        "types": ["opened", "synchronize", "reopened"]
    "workflow_dispatch": # yamllint disable-line rule:empty-values

"concurrency":
    "group": "${{ github.workflow }}-${{ github.ref }}"
    "cancel-in-progress": true

"permissions":
    "contents": "read" # to fetch code (actions/checkout)

"jobs":
    "typecheck":
        "name": "Typecheck (node-${{ matrix.node_version }})"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 20
        "strategy":
            "fail-fast": false
            "matrix":
                "node_version": ["22.14", "24.10"]
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
                  # Number of commits to fetch. 0 indicates all history for all branches and tags.
                  # Pulls all commits (needed for `vis affected` base/head SHA resolution)
                  "fetch-depth": 0
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js ${{ matrix.node_version }}"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "${{ matrix.node_version }}"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm + vis caches"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": |
                      ${{ steps.pnpm-store.outputs.path }}
                      .vis
                  "key": "pnpm-vis-${{ runner.os }}-node${{ matrix.node_version }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-vis-${{ runner.os }}-node${{ matrix.node_version }}-
                      pnpm-vis-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            # Only write back to the shared cache from trusted refs (push events).
            # PRs (including forks) restore the cache but never write to it.
            - "name": "Save pnpm + vis caches"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": |
                      ${{ steps.pnpm-store.outputs.path }}
                      .vis
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Typecheck (affected) on PRs"
              "if": "github.event_name == 'pull_request'"
              "run": "pnpm run lint:affected:types"

            - "name": "Typecheck (all) on push / dispatch"
              "if": "github.event_name != 'pull_request'"
              "run": "pnpm run lint:types"

    "test":
        "name": "Test (node-${{ matrix.node_version }})"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "strategy":
            "fail-fast": false
            "matrix":
                "node_version": ["22.14", "24.10"]
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
                  "fetch-depth": 0
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js ${{ matrix.node_version }}"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "${{ matrix.node_version }}"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm + vis caches"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": |
                      ${{ steps.pnpm-store.outputs.path }}
                      .vis
                  "key": "pnpm-vis-${{ runner.os }}-node${{ matrix.node_version }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-vis-${{ runner.os }}-node${{ matrix.node_version }}-
                      pnpm-vis-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm + vis caches"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": |
                      ${{ steps.pnpm-store.outputs.path }}
                      .vis
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Run affected tests on PR"
              "if": "github.event_name == 'pull_request'"
              "run": "pnpm run test:affected"
              "env":
                  # Opt into the workerd-pool integration suites (cirrus-do,
                  # cirrus-client, cirrus-scheduler, cirrus-storage). Locally
                  # gated by a flag because sandboxed dev environments can't
                  # loopback to `cloudflare:test-internal`; GitHub runners can.
                  "CIRRUS_WORKERD_TESTS": "1"

            - "name": "Run all tests with coverage on push / dispatch"
              "if": "github.event_name != 'pull_request'"
              "run": "pnpm run test:coverage"
              "env":
                  "CIRRUS_WORKERD_TESTS": "1"

            # Upload coverage on main/alpha pushes only, with Node 22.14.
            - "name": "Upload coverage to Codecov"
              "if": "github.event_name == 'push' && matrix.node_version == '22.14' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha')"
              "uses": "codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7" # v5.5.1
              "with":
                  "token": "${{ secrets.CODECOV_TOKEN }}"
                  "fail_ci_if_error": false
                  "verbose": true

    "build":
        "name": "Build (node-${{ matrix.node_version }})"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "strategy":
            "fail-fast": false
            "matrix":
                "node_version": ["22.14", "24.10"]
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
                  "fetch-depth": 0
              "env":
                  "GIT_COMMITTER_NAME": "GitHub Actions Shell"
                  "GIT_AUTHOR_NAME": "GitHub Actions Shell"
                  "EMAIL": "github-actions[bot]@users.noreply.github.com"

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js ${{ matrix.node_version }}"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "${{ matrix.node_version }}"

            - "name": "Resolve pnpm store path"
              "id": "pnpm-store"
              "shell": "bash"
              "run": |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - "name": "Restore pnpm + vis caches"
              "id": "pnpm-cache"
              "uses": "actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": |
                      ${{ steps.pnpm-store.outputs.path }}
                      .vis
                  "key": "pnpm-vis-${{ runner.os }}-node${{ matrix.node_version }}-${{ hashFiles('pnpm-lock.yaml') }}"
                  "restore-keys": |
                      pnpm-vis-${{ runner.os }}-node${{ matrix.node_version }}-
                      pnpm-vis-${{ runner.os }}-

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Save pnpm + vis caches"
              "if": "github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'"
              "uses": "actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae" # v5.0.5
              "with":
                  "path": |
                      ${{ steps.pnpm-store.outputs.path }}
                      .vis
                  "key": "${{ steps.pnpm-cache.outputs.cache-primary-key }}"

            - "name": "Build affected packages on PR"
              "if": "github.event_name == 'pull_request'"
              "run": "pnpm run build:affected"

            - "name": "Build all packages on push / dispatch"
              "if": "github.event_name != 'pull_request'"
              "run": "pnpm run build:packages"

    "e2e":
        "name": "E2E (Playwright + Miniflare)"
        # PR-only — push/dispatch already exercise the unit-test matrix and the
        # E2E run takes ~30s on a warm runner which would otherwise lengthen
        # every merge. CI_E2E_SKIP can be set as a repo variable to disable
        # without a code change if the suite goes flaky.
        "if": "github.event_name == 'pull_request' && vars.CI_E2E_SKIP != 'true'"
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 20
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              "with":
                  "egress-policy": "audit"

            - "name": "Git checkout"
              "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              "with":
                  "persist-credentials": false
                  "fetch-depth": 0

            - "name": "Setup pnpm"
              "uses": "pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093" # v6.0.8
              "with":
                  "version": "11.3.0"
                  "run_install": false

            - "name": "Use Node.js 22.14"
              "uses": "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              "with":
                  "node-version": "22.14"

            - "name": "Install dependencies"
              "run": "pnpm install --frozen-lockfile"

            - "name": "Install Playwright browsers"
              # The cache key includes the playwright version so we don't
              # invalidate on unrelated dep changes. The image already has
              # Firefox/Chromium system deps so we don't need --with-deps.
              "run": "pnpm --filter @cirrus/e2e exec playwright install chromium firefox"

            - "name": "Run E2E suite"
              "env":
                  "CI": "true"
                  "CIRRUS_E2E": "true"
              "run": "pnpm e2e"

            - "name": "Upload Playwright report on failure"
              "if": "failure()"
              "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              "with":
                  "name": "playwright-report"
                  "path": "tests/e2e/playwright-report"
                  "retention-days": 7
