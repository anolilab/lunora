"name": "Zizmor"
"on":
    "push":
        "branches": ["main", "alpha", "next", "beta"]
        "paths": [".github/**"]
    "pull_request":
        "branches": ["main", "alpha", "next", "beta"]
        # zizmor audits GitHub Actions workflows — nothing else can change its result.
        "paths": [".github/**"]
"permissions": {}
"jobs":
    "zizmor":
        "permissions":
            "security-events": "write"
            "contents": "read"
        "uses": "anolilab/workflows/.github/workflows/zizmor.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        "with":
            "min_severity": "medium"
