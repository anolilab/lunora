"name": "Labeler"

"on": # yamllint disable-line rule:truthy
    - "pull_request_target"

"permissions":
    "contents": "read"

"jobs":
    "triage":
        "runs-on": "ubuntu-latest"
        "timeout-minutes": 30
        "permissions":
            "contents": "read"
            "pull-requests": "write"
        "steps":
            - "name": "Harden Runner"
              "uses": "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              "with":
                  "egress-policy": "audit"

            # `secrets.GITHUB_TOKEN` returns transient HTTP 401 mid-call;
            # wrap with a two-shot retry (same pattern as cargo-test.yml).
            - "id": "labeler"
              "continue-on-error": true
              "uses": "actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13" # v7.0.0
              "with":
                  "repo-token": "${{ secrets.GITHUB_TOKEN }}"
                  "configuration-path": "labeler-config.yml"

            - "name": "Wait before retrying labeler"
              "if": "steps.labeler.outcome == 'failure'"
              "shell": "bash"
              "run": "sleep 15"

            - "name": "Labeler (retry)"
              "if": "steps.labeler.outcome == 'failure'"
              "uses": "actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13" # v7.0.0
              "with":
                  "repo-token": "${{ secrets.GITHUB_TOKEN }}"
                  "configuration-path": "labeler-config.yml"
