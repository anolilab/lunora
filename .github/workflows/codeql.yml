"name": "CodeQL"
"on":
    "push":
        "branches": ["main", "alpha", "next", "beta"]
    "pull_request":
        "branches": ["main", "alpha", "next", "beta", "fix/**"]
        # Only scan PRs that touch analyzable JS/TS source (or this workflow).
        # Docs/plans-only PRs skip; push + weekly schedule stay ungated so
        # branch heads always carry a complete code-scanning baseline.
        "paths":
            - "**/*.ts"
            - "**/*.tsx"
            - "**/*.mts"
            - "**/*.cts"
            - "**/*.js"
            - "**/*.jsx"
            - "**/*.mjs"
            - "**/*.cjs"
            - "**/*.vue"
            - "**/*.svelte"
            - "**/*.astro"
            - ".github/workflows/codeql.yml"
    "schedule":
        - "cron": "0 0 * * 1"
"permissions": {}
"jobs":
    "codeql":
        "permissions":
            "security-events": "write"
            "actions": "read"
            "contents": "read"
        "uses": "anolilab/workflows/.github/workflows/codeql.yml@045a2d464dad0661a570c8a3c19f4b32bf9efad9" # v15.3.0+
        "with":
            "languages": "[\"javascript-typescript\"]"
            "branches": "[\"main\", \"alpha\", \"next\", \"beta\"]"
