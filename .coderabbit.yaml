# CodeRabbit Configuration
# https://docs.coderabbit.ai/reference/configuration/

"language": "en-US"

"chat":
    "auto_reply": true

"reviews":
    "high_level_summary": true
    "poem": false
    "review_status": true
    "collapse_walkthrough": false
    "auto_review":
        "enabled": true
        "ignore_title_keywords":
            - "WIP"
            - "DO NOT MERGE"
        "drafts": false
        "base_branches":
            - "main"
            - "alpha"
            # Audit-round fix PRs are stacked on this branch so each group is
            # reviewable on its own; auto review skips any base not listed here.
            - "fix/audit-round-5"
            # The audit chain: each group PR is based on the previous one.
            - "fix/r7-auth-agent-mail"
            - "fix/r7-payment"
            - "fix/r7-adapters-replica"
            - "fix/r7-storage-planes"
            - "fix/r7-paywall-ratelimit"
            - "fix/r7-values-bounds"
            - "fix/r7-cli-vite-client"
            - "fix/r7-foundations"
            - "fix/r8-client-react"
            - "fix/r8-do-streams"
            - "fix/r8-edges"

    "profile": "chill"

    "path_filters":
        - "packages/**"
        # `shared/` is bundler-inlined rather than a package, so it matched no
        # filter here and was skipped in full — including the cache-key encoder
        # and the base64url codec on the HMAC signed-URL path.
        - "shared/**"
        - "apps/**"
        - "tools/**"
        - "scripts/**"
        - ".github/**"
        - "!**/__tests__/**"
        - "!**/__fixtures__/**"
        - "!**/*.test.ts"
        - "!**/*.test.js"
        - "!**/*.spec.ts"
        - "!**/*.spec.js"
        - "!**/node_modules/**"
        - "!**/dist/**"
        - "!**/build/**"
        - "!**/.vis/**"
        - "!**/.task-runner/**"
        # semantic-release writes these; reviewing generated release notes is
        # pure noise.
        - "!**/CHANGELOG.md"
        # Long-form prose docs (`packages/*/docs/**`, `apps/docs/src/content/**`).
        # Excluded so the reviewable-file count stays under the 100-file cap that
        # otherwise makes CodeRabbit skip a large PR ENTIRELY — trading review of
        # the prose for review of none of the code is the wrong way round.
        # READMEs are deliberately still reviewed: they are the entry point a
        # user reads first, and a wrong snippet there costs the most.
        - "!**/docs/**"

    "path_instructions":
        - "path": "*"
          "instructions": "All character sets need to be in UTF-8.\n
              Lines need to end with LF (line feed).\n
              Spaces need to be utilized for indentation instead of tabs.\n
              A newline must be inserted at the end of the file.\n
              Trim all trailing whitespaces.\n
              Ensure that lines align visually.\n"
        - "path": "__tests__/**.*"
          "instructions": |
              "Assess the unit test code employing the Vitest testing framework. Confirm that:
              - The tests adhere to Vitest's established best practices.
              - Test descriptions are sufficiently detailed to clarify the purpose of each test."
        - "path": "packages/**/*.ts"
          "instructions": |
              Review TypeScript code following the project's coding guidelines:
              - Use ES module syntax
              - Follow DRY principles
              - Ensure proper TypeScript types
              - Check for performance optimizations
              - Verify error handling
              - The code adheres to best practices associated with nodejs.
        - "path": "apps/**/*.ts"
          "instructions": |
              Review application code for:
              - Best practices and potential issues
              - Proper error handling
              - Performance considerations
        - "path": "packages/**/src/**/*.ts"
          "instructions": |
              Review library source code:
              - Ensure modularity and reusability
              - Check for proper exports
              - Verify TypeScript types are correct
              - The code adheres to best practices recommended for performance.
              - Ensure code follows project patterns

    "tools":
        "eslint":
            "enabled": true
        "gitleaks":
            "enabled": true
