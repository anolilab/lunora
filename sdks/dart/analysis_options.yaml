# Lint rules for the hand-written Dart transport and its conformance suite.
#
# The rules are listed here rather than pulled in with `include: package:lints/…`
# because that would be a dev dependency, and this package is defined not to have
# any (see `pubspec.yaml`). The set below is the `package:lints/recommended`
# selection minus the rules this code deliberately does not follow, each noted.
analyzer:
    language:
        strict-casts: true
        strict-raw-types: true
    errors:
        # An unused import is a mistake, not a suggestion.
        unused_import: error
        unused_local_variable: error
    exclude:
        # Never linted: the models come from quicktype, whose style this repo does
        # not own, and any correction here is undone by the next regeneration.
        # Correctness in generated output is enforced in the emitter instead —
        # `packages/codegen/src/sdk/targets/dart.ts`.
        - "**/models.dart"

linter:
    rules:
        - always_declare_return_types
        - annotate_overrides
        - avoid_empty_else
        - avoid_init_to_null
        - avoid_relative_lib_imports
        - avoid_return_types_on_setters
        - avoid_shadowing_type_parameters
        - avoid_types_as_parameter_names
        - await_only_futures
        - camel_case_extensions
        - camel_case_types
        - curly_braces_in_flow_control_structures
        - depend_on_referenced_packages
        - empty_catches
        - file_names
        - library_prefixes
        - no_duplicate_case_values
        - non_constant_identifier_names
        - null_check_on_nullable_type_parameter
        - prefer_final_fields
        - prefer_generic_function_type_aliases
        - prefer_is_empty
        - prefer_is_not_empty
        - prefer_typing_uninitialized_variables
        - provide_deprecation_message
        - unnecessary_new
        - unnecessary_this
        - unrelated_type_equality_checks
        - use_rethrow_when_possible
        - valid_regexps
