# `lunora-hostd`: the daemon a customer installs on their own server so Lunora
# Cloud can run celld fleets on it (plan 458). One static binary per platform,
# built by .github/workflows/hostd-release.yml; the wire protocol it speaks is
# protocol/hostd/README.md, shared with the control plane's TypeScript
# (apps/cloud/src/hostd) through the golden frames in
# protocol/hostd/fixtures/messages.json.
[package]
name = "lunora-hostd"
# The released version comes from LUNORA_HOSTD_VERSION at build time (build.rs);
# this stays 0.0.0.
version = "0.0.0"
edition = "2024"
license = "FSL-1.1-Apache-2.0"
publish = false
description = "Runs Lunora Cloud fleets on your own server"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize", "pkcs8", "pem"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
if-addrs = "0.15.0"
indexmap = { version = "2.14.2", features = ["serde"] }
lexopt = "0.3.2"
libc = "0.2.190"
md-5 = "0.11.0"
regex = "1.13.1"
# One TLS stack for every connection: rustls on ring (no aws-lc, so the musl
# cross build needs no cmake), with the system's roots for HTTPS.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
rusty-s3 = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: frames and configs keep their key order, so the bytes match
# what the TypeScript reference writes. `float_roundtrip`: a number reads as
# the same double `JSON.parse` reads.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "macros", "net", "process", "time", "signal", "fs", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["__rustls-tls", "connect"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "macros", "test-util"] }
# The integration tests' HTTPS artifact server (tests/support/tls.rs).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# `test-fakes` builds the fake celld and Caddy the black-box tests run in place of the real ones, and the tests that
# drive them: `cargo test --features test-fakes`. Never on in a release build, so the fakes never ship.
[features]
test-fakes = []

[[bin]]
name = "lunora-hostd"
path = "src/main.rs"

[[bin]]
name = "fake-celld"
path = "tests/fakes/celld.rs"
required-features = ["test-fakes"]

[[bin]]
name = "fake-caddy"
path = "tests/fakes/caddy.rs"
required-features = ["test-fakes"]

[[test]]
name = "cli"
required-features = ["test-fakes"]

[[test]]
name = "daemon"
required-features = ["test-fakes"]

[[test]]
name = "enrol"
required-features = ["test-fakes"]

[[test]]
name = "upgrade"
required-features = ["test-fakes"]

# The `test:hostd` lane: real celld, Caddy and an S3 endpoint, so its tests are `#[ignore]`d; test.yml's `test-hostd`
# runs them with `--ignored`.
[[test]]
name = "lane"
required-features = ["test-fakes"]

[[test]]
name = "lane_upgrade"
required-features = ["test-fakes"]

# Small and self-contained: the box runs nothing else of ours. A panic aborts,
# so systemd restarts a daemon that is in an unknown state instead of leaving
# it running with one task gone.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"
